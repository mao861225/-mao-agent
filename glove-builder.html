<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手套客製化 | 阿男伍叁</title>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--accent:#c8a84b;--accent-dk:#8b6914;--text:#e8e8f0;--muted:#888899;--border:#2a2a3a;--ok:#2db87d;--r:12px;--t:.2s ease}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:15px;letter-spacing:-.5px}
.logo h1{font-size:15px;font-weight:700}
.logo p{font-size:11px;color:var(--muted)}
.langs{display:flex;gap:3px;background:var(--surface2);border-radius:8px;padding:3px}
.lb{padding:5px 11px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted);transition:var(--t)}
.lb.on{background:var(--accent);color:#000}

/* Steps */
.steps{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;overflow-x:auto}
.stab{padding:13px 18px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:default}
.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.stab.done{color:var(--text)}
.snum{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.stab.on .snum{background:var(--accent);color:#000}
.stab.done .snum{background:var(--ok);color:#fff}

/* Layout */
.main{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 108px)}
.opts{padding:28px 24px;border-right:1px solid var(--border)}
.sc{display:none;animation:fi .25s ease}
.sc.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Section labels */
.slabel{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:18px}

/* Option groups */
.og{margin-bottom:24px}
.olabel{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.req{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* Radio pills */
.rg{display:flex;flex-wrap:wrap;gap:7px}
.ro{position:relative}
.ro input{position:absolute;opacity:0;width:0;height:0}
.ro label{display:flex;align-items:center;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;transition:var(--t);background:var(--surface);line-height:1}
.ro input:checked+label{border-color:var(--accent);background:rgba(200,168,75,.12);color:var(--accent)}
.ro label:hover{border-color:var(--accent-dk)}

/* Color zones */
.czones{display:flex;flex-direction:column;gap:14px}
.czone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.czone-hdr{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cprev{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;transition:background .15s}
.czone-name{font-size:13px;font-weight:600}
.cname-cur{font-size:11px;color:var(--muted);margin-left:auto}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
.sw:hover{transform:scale(1.18);z-index:1;position:relative}
.sw.on{border-color:#fff;transform:scale(1.1)}

/* Inputs */
.inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:13px;transition:var(--t)}
.inp:focus{outline:none;border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
textarea.inp{height:90px;resize:vertical;font-family:inherit}
.err{color:#e05c5c;font-size:11px;margin-top:5px;display:none}

/* Nav buttons */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.btn{padding:11px 26px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:var(--t)}
.btn-p{background:var(--accent);color:#000}
.btn-p:hover{background:#d9b958}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{border-color:var(--accent-dk)}

/* Preview panel */
.preview{padding:28px 18px;position:sticky;top:108px;height:calc(100vh - 108px);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.pvlabel{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.gbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;justify-content:center;align-items:center}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.scardtitle{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.srow:last-child{border-bottom:none}
.skey{color:var(--muted)}
.sval{font-weight:600;display:flex;align-items:center;gap:5px}
.sdot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* Success */
.succ{display:none;text-align:center;padding:60px 20px}
.succ-icon{width:72px;height:72px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:32px}
.succ h2{font-size:22px;margin-bottom:10px}
.succ p{color:var(--muted);line-height:1.6;font-size:14px}

@media(max-width:760px){
  .main{grid-template-columns:1fr}
  .preview{position:static;height:auto;border-top:1px solid var(--border)}
  .stab .slbl{display:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-icon">53</div>
    <div>
      <h1 id="bname">阿男伍叁</h1>
      <p id="bsub">手套客製化</p>
    </div>
  </div>
  <div class="langs">
    <button class="lb on" onclick="setLang('zh')">中文</button>
    <button class="lb" onclick="setLang('en')">EN</button>
    <button class="lb" onclick="setLang('ja')">日本語</button>
  </div>
</header>

<div class="steps">
  <div class="stab on" id="tab1"><div class="snum">1</div><span class="slbl" data-k="step1">基本配置</span></div>
  <div class="stab" id="tab2"><div class="snum">2</div><span class="slbl" data-k="step2">顏色選擇</span></div>
  <div class="stab" id="tab3"><div class="snum">3</div><span class="slbl" data-k="step3">個人刺繡</span></div>
  <div class="stab" id="tab4"><div class="snum">4</div><span class="slbl" data-k="step4">訂購資訊</span></div>
</div>

<div class="main">

<!-- ─── Left ─── -->
<div class="opts">

  <!-- Step 1 -->
  <div class="sc on" id="s1">
    <p class="slabel" data-k="step1">基本配置</p>

    <div class="og">
      <div class="olabel"><span data-k="throwHand">慣用手</span><div class="req"></div></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="hand" id="hr" value="right" checked><label for="hr" data-k="rHand">右投（戴左手）</label></div>
        <div class="ro"><input type="radio" name="hand" id="hl" value="left"><label for="hl" data-k="lHand">左投（戴右手）</label></div>
      </div>
    </div>

    <div class="og">
      <div class="olabel"><span data-k="size">尺寸</span><div class="req"></div></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="size" id="s1125" value='11.25" ' checked><label for="s1125">11.25"</label></div>
        <div class="ro"><input type="radio" name="size" id="s115" value='11.5"'><label for="s115">11.5"</label></div>
        <div class="ro"><input type="radio" name="size" id="s1175" value='11.75"'><label for="s1175">11.75"</label></div>
        <div class="ro"><input type="radio" name="size" id="s12" value='12"'><label for="s12">12"</label></div>
        <div class="ro"><input type="radio" name="size" id="s125" value='12.5"'><label for="s125">12.5"</label></div>
      </div>
    </div>

    <div class="og">
      <div class="olabel"><span data-k="webStyle">網型</span><div class="req"></div></div>
      <div class="rg" id="web-rg">
        <div class="ro"><input type="radio" name="web" id="wi" value="i-web" checked><label for="wi" data-wk="i-web">I 型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wh" value="h-web"><label for="wh" data-wk="h-web">H 型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wb" value="basket"><label for="wb" data-wk="basket">籃型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wsp" value="single-post"><label for="wsp" data-wk="single-post">單柱網</label></div>
        <div class="ro"><input type="radio" name="web" id="wmt" value="modified-trap"><label for="wmt" data-wk="modified-trap">修改型梯形網</label></div>
      </div>
    </div>

    <div class="og">
      <div class="olabel"><span data-k="stiffness">手套硬度</span></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="stiff" id="shd" value="stiff"><label for="shd" data-k="stiff">硬</label></div>
        <div class="ro"><input type="radio" name="stiff" id="smd" value="medium" checked><label for="smd" data-k="medium">中</label></div>
        <div class="ro"><input type="radio" name="stiff" id="sft" value="soft"><label for="sft" data-k="soft">軟</label></div>
      </div>
    </div>

    <div class="nav"><div></div><button class="btn btn-p" onclick="go(2)" data-k="next">下一步</button></div>
  </div>

  <!-- Step 2 -->
  <div class="sc" id="s2">
    <p class="slabel" data-k="step2">顏色選擇</p>
    <div class="czones" id="czones"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(1)" data-k="prev">上一步</button>
      <button class="btn btn-p" onclick="go(3)" data-k="next">下一步</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="sc" id="s3">
    <p class="slabel" data-k="step3">個人刺繡</p>
    <div class="og"><div class="olabel"><span data-k="thumbTxt">拇指刺繡文字</span></div><input class="inp" id="thumbTxt" maxlength="15" placeholder=""></div>
    <div class="og"><div class="olabel"><span data-k="pinkyTxt">尾指刺繡文字</span></div><input class="inp" id="pinkyTxt" maxlength="15" placeholder=""></div>
    <div class="og"><div class="olabel"><span data-k="palmTxt">掌心印字</span></div><input class="inp" id="palmTxt" maxlength="20" placeholder=""></div>
    <div class="og"><div class="olabel"><span data-k="wristTxt">腕帶文字</span></div><input class="inp" id="wristTxt" maxlength="20" placeholder=""></div>
    <div class="og"><div class="olabel"><span data-k="notes">特殊需求</span></div><textarea class="inp" id="notesTxt"></textarea></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(2)" data-k="prev">上一步</button>
      <button class="btn btn-p" onclick="go(4)" data-k="next">下一步</button>
    </div>
  </div>

  <!-- Step 4 -->
  <div class="sc" id="s4">
    <p class="slabel" data-k="step4">訂購資訊</p>
    <div class="og"><div class="olabel"><span data-k="cName">姓名</span><div class="req"></div></div><input class="inp" id="cName" placeholder=""></div>
    <div class="og">
      <div class="olabel"><span data-k="cEmail">Email</span><div class="req"></div></div>
      <input class="inp" type="email" id="cEmail" placeholder="">
      <p class="err" id="emailErr" data-k="emailErr">Email 格式不正確</p>
    </div>
    <div class="og"><div class="olabel"><span data-k="cPhone">電話</span></div><input class="inp" type="tel" id="cPhone" placeholder=""></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(3)" data-k="prev">上一步</button>
      <button class="btn btn-p" id="submitBtn" onclick="doSubmit()" data-k="submit">送出訂單</button>
    </div>
  </div>

  <!-- Success -->
  <div class="succ" id="succScreen">
    <div class="succ-icon">✓</div>
    <h2 data-k="succTitle">訂單已送出！</h2>
    <p data-k="succMsg">我們將在 2 個工作天內與您聯繫確認報價。</p>
  </div>

</div>

<!-- ─── Right ─── -->
<div class="preview">
  <div>
    <p class="pvlabel" data-k="preview">預覽</p>
    <div class="gbox">
      <!-- Baseball Glove SVG -->
      <svg id="gsvg" viewBox="0 0 280 360" xmlns="http://www.w3.org/2000/svg" width="230" height="295" style="transition:transform .3s">
        <defs>
          <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="rgba(0,0,0,.65)"/></filter>
        </defs>

        <!-- Wrist strap -->
        <path id="sv-wrist"
          d="M88,312 L88,350 Q140,363 192,350 L192,312 C178,319 161,322 140,322 C119,322 102,319 88,312Z"
          fill="#C19A6B" filter="url(#sh)"/>
        <line x1="98" y1="332" x2="182" y2="332" stroke="#8B6914" stroke-width="1.5" stroke-dasharray="6,4" opacity=".6"/>

             C74,157 82,160 90,152 C94,146 97,136 101,124

             L179,124 C183,136 186,146 190,152 C198,160 206,157 215,164
             C226,172 232,188 232,215 C232,260 212,292 192,312
             C178,319 161,322 140,322 C119,322 102,319 88,312Z"
          fill="#C19A6B" filter="url(#sh)"/>

        <!-- Finger dividers (detail lines on back) -->
        <line x1="109" y1="124" x2="104" y2="172" stroke="#7A5C10" stroke-width="1.5" opacity=".5"/>
        <line x1="132" y1="94" x2="132" y2="168" stroke="#7A5C10" stroke-width="1.5" opacity=".5"/>
        <line x1="152" y1="94" x2="152" y2="168" stroke="#7A5C10" stroke-width="1.5" opacity=".5"/>
        <line x1="171" y1="124" x2="176" y2="172" stroke="#7A5C10" stroke-width="1.5" opacity=".5"/>

        <!-- Thumb -->
        <path id="sv-thumb"
          d="M215,164 C225,154 245,148 254,162 C263,177 255,205 241,220
             C231,230 220,229 212,222 C207,217 207,204 210,192 C213,179 213,172 215,164Z"
          fill="#C19A6B" filter="url(#sh)"/>

        <!-- Web area (between index and thumb) -->
        <path id="sv-web"
          d="M179,124 C192,112 210,108 218,120 C225,131 222,146 215,157
             C210,151 207,145 205,138 L200,148 C196,141 190,134 183,128Z"
          fill="#6B4510"/>

        <!-- Web detail: I-Web (default) -->
        <g id="webDetail" transform="translate(200,120)">
          <rect id="wv" x="-4" y="0" width="8" height="26" rx="3" fill="#4A3008"/>
          <rect id="wh" x="-14" y="10" width="28" height="7" rx="3" fill="#4A3008"/>
        </g>

        <!-- Palm overlay (translucent color zone) -->
        <ellipse id="sv-palm" cx="140" cy="225" rx="63" ry="58" fill="#B8860B" opacity=".32"/>

        <!-- Laces (dots between fingers and on edges) -->
        <g id="sv-laces">
          <circle cx="110" cy="138" r="3.5" fill="#C19A6B"/>
          <circle cx="108" cy="150" r="3.5" fill="#C19A6B"/>
          <circle cx="134" cy="128" r="3.5" fill="#C19A6B"/>
          <circle cx="134" cy="141" r="3.5" fill="#C19A6B"/>
          <circle cx="153" cy="128" r="3.5" fill="#C19A6B"/>
          <circle cx="153" cy="141" r="3.5" fill="#C19A6B"/>
          <circle cx="170" cy="138" r="3.5" fill="#C19A6B"/>
          <circle cx="172" cy="150" r="3.5" fill="#C19A6B"/>
          <circle cx="54" cy="195" r="3" fill="#C19A6B"/>
          <circle cx="52" cy="213" r="3" fill="#C19A6B"/>
          <circle cx="54" cy="232" r="3" fill="#C19A6B"/>
          <circle cx="226" cy="195" r="3" fill="#C19A6B"/>
          <circle cx="228" cy="213" r="3" fill="#C19A6B"/>
          <circle cx="226" cy="232" r="3" fill="#C19A6B"/>
        </g>

        <!-- Stitching -->
        <g id="sv-stitching">
          <path d="M106,202 Q140,188 174,202" fill="none" stroke="#7A5C10" stroke-width="1.5" stroke-dasharray="5,3"/>
          <path d="M100,228 Q140,214 180,228" fill="none" stroke="#7A5C10" stroke-width="1.5" stroke-dasharray="5,3"/>
        </g>

        <!-- Binding (edge highlight) -->
        <path id="sv-binding"
          d="M88,312 C68,292 48,260 48,215 C48,188 54,172 65,164
             C74,157 82,160 90,152 C94,146 97,136 101,124
             L108,124 L112,108 L120,124 L128,122 L131,94 L136,122
             L144,122 L148,94 L153,122 L161,122 L164,108 L172,124
             L179,124 C183,136 186,146 190,152 C198,160 206,157 215,164"
          fill="none" stroke="#D4A017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="sv-binding-thumb"
          d="M215,164 C225,154 245,148 254,162 C263,177 255,205 241,220 C231,230 220,229 212,222"
          fill="none" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>

      </svg>
    </div>
  </div>

  <!-- Summary -->
  <div class="scard">
    <p class="scardtitle" data-k="summary">配置摘要</p>
    <div id="srows"></div>
  </div>
</div>

</div><!-- /main -->

    throwHand:'利き手',rHand:'右投げ（左手装着）',lHand:'左投げ（右手装着）',
    size:'サイズ',webStyle:'ウェブ',stiffness:'硬さ',
    stiff:'硬い',medium:'普通',soft:'柔らかい',
    back:'背革',palm:'手のひら革',web:'ウェブ',laces:'レース',binding:'バインディング',stitching:'ステッチ',
    thumbTxt:'親指刺繍',pinkyTxt:'小指刺繍',palmTxt:'パームスタンプ',wristTxt:'リスト文字',notes:'特記事項',
    cName:'お名前',cEmail:'メールアドレス',cPhone:'電話番号',
    submit:'注文を送信',submitting:'送信中...',
    succTitle:'注文を受け付けました！',succMsg:'2営業日以内にご連絡いたします。',
    preview:'プレビュー',summary:'設定内容',next:'次へ',prev:'戻る',
    emailErr:'メールアドレスの形式が正しくありません',nameErr:'お名前を入力してください',
    ws:{'i-web':'I型ウェブ','h-web':'H型ウェブ','basket':'バスケットウェブ','single-post':'シングルポスト','modified-trap':'変形トラップ'},
    sl:{stiff:'硬い',medium:'普通',soft:'柔らかい'},hl:{right:'右投げ',left:'左投げ'}
  }
};

// ── Colors ────────────────────────────────────────────────────────────────────
const COLORS = [
  {k:'camel',h:'#C19A6B',n:'Camel'},{k:'tan',h:'#D2B48C',n:'Tan'},
  {k:'brown',h:'#3D1C02',n:'Dark Brown'},{k:'black',h:'#1A1A1A',n:'Black'},
  {k:'navy',h:'#0B2167',n:'Navy'},{k:'red',h:'#CC0000',n:'Red'},
  {k:'royal',h:'#1A4BBF',n:'Royal Blue'},{k:'green',h:'#1A5C1A',n:'Forest Green'},
  {k:'orange',h:'#E05C00',n:'Orange'},{k:'grey',h:'#4A4A4A',n:'Graphite'},
  {k:'white',h:'#F0EBE3',n:'White'},{k:'gold',h:'#D4A017',n:'Gold'},
  {k:'purple',h:'#5C1A8A',n:'Purple'},{k:'columbia',h:'#7BB2CC',n:'Columbia Blue'},
  {k:'maroon',h:'#800020',n:'Maroon'}
];

const ZONES = [
  {id:'back',  els:['sv-back','sv-thumb'],           dk:'camel'},
  {id:'palm',  els:['sv-palm'],                      dk:'camel'},
  {id:'web',   els:['sv-web','wv','wh'],             dk:'brown'},
  {id:'laces', els:['sv-laces'],  grp:true,          dk:'camel'},
  {id:'binding',els:['sv-binding','sv-binding-thumb'],stroke:true,dk:'gold'},
  {id:'stitching',els:['sv-stitching'],grp:true,stroke:true,dk:'brown'},
];

// ── State ─────────────────────────────────────────────────────────────────────
let lang = 'zh';
const ST = {
  hand:'right', size:'11.25"', web:'i-web', stiff:'medium',
  colors: Object.fromEntries(ZONES.map(z=>[z.id,COLORS.find(c=>c.k===z.dk)])),
};

// ── Language ──────────────────────────────────────────────────────────────────
function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',
    (l==='zh'&&b.textContent.includes('中'))||(l==='en'&&b.textContent==='EN')||(l==='ja'&&b.textContent.includes('日'))));
  const t=T[l];
  document.getElementById('bname').textContent=t.brand;
  document.getElementById('bsub').textContent=t.bsub;
  document.title=`${t.bsub} | ${t.brand}`;
  document.querySelectorAll('[data-k]').forEach(el=>{const v=t[el.dataset.k];if(v)el.textContent=v;});
  document.querySelectorAll('[data-wk]').forEach(el=>{const v=t.ws[el.dataset.wk];if(v)el.textContent=v;});
  buildZones(); updateSummary();
}

// ── Step nav ──────────────────────────────────────────────────────────────────
function go(n){
  document.querySelectorAll('.sc').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.stab').forEach((t,i)=>{
    t.classList.remove('on','done');
    if(i+1<n)t.classList.add('done');
    if(i+1===n)t.classList.add('on');
  });
  const el=document.getElementById('s'+n);
  if(el)el.classList.add('on');
  updateSummary();
}

// ── Color zones UI ────────────────────────────────────────────────────────────
function buildZones(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const c=document.getElementById('czones');
  c.innerHTML='';
  ZONES.forEach(z=>{
    const sel=ST.colors[z.id];
    const d=document.createElement('div');
    d.className='czone';
    d.innerHTML=`
      <div class="czone-hdr">
        <div class="cprev" id="cp-${z.id}" style="background:${sel.h}"></div>
        <span class="czone-name">${zl[z.id]}</span>
        <span class="cname-cur" id="cn-${z.id}">${sel.n}</span>
      </div>
      <div class="swatches">${COLORS.map(c=>`
        <div class="sw${c.k===sel.k?' on':''}" style="background:${c.h};${c.k==='white'?'border-color:#3a3a4a':''}"
             title="${c.n}" data-z="${z.id}" data-k="${c.k}" onclick="pickColor('${z.id}','${c.k}')"></div>
      `).join('')}</div>`;
    c.appendChild(d);
  });
}

// ── Pick color ────────────────────────────────────────────────────────────────
function pickColor(zid,ck){
  const color=COLORS.find(c=>c.k===ck);
  ST.colors[zid]=color;
  document.querySelectorAll(`[data-z="${zid}"]`).forEach(s=>s.classList.toggle('on',s.dataset.k===ck));
  const cp=document.getElementById('cp-'+zid); if(cp)cp.style.background=color.h;
  const cn=document.getElementById('cn-'+zid); if(cn)cn.textContent=color.n;
  const zone=ZONES.find(z=>z.id===zid);
  zone.els.forEach(eid=>{
    const el=document.getElementById(eid); if(!el)return;
    if(zone.grp){
      el.querySelectorAll('circle,path,line,rect').forEach(ch=>{
        zone.stroke?ch.setAttribute('stroke',color.h):ch.setAttribute('fill',color.h);
      });
    } else if(zone.stroke){
      el.setAttribute('stroke',color.h);
    } else {
      el.setAttribute('fill',color.h);
    }
  });
  updateSummary();
}

// ── Summary ───────────────────────────────────────────────────────────────────
function updateSummary(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const rows=[
    {k:t.throwHand,v:t.hl[ST.hand]},
    {k:t.size,v:ST.size},
    {k:t.webStyle,v:t.ws[ST.web]},
    {k:t.stiffness,v:t.sl[ST.stiff]},
    ...ZONES.map(z=>({k:zl[z.id],v:ST.colors[z.id]?.n,c:ST.colors[z.id]?.h})),
  ];
  document.getElementById('srows').innerHTML=rows.map(r=>`
    <div class="srow">
      <span class="skey">${r.k}</span>
      <span class="sval">${r.c?`<span class="sdot" style="background:${r.c}"></span>`:''}${r.v||'—'}</span>
    </div>`).join('');
}

// ── Web style SVG ─────────────────────────────────────────────────────────────
document.querySelectorAll('input[name="web"]').forEach(r=>r.addEventListener('change',()=>{
  ST.web=r.value;
  const wv=document.getElementById('wv'), wh=document.getElementById('wh');
  switch(r.value){
    case 'i-web':  wv.setAttribute('width','8');wv.setAttribute('x','-4');wh.style.display='';wh.setAttribute('width','28');break;
    case 'h-web':  wv.setAttribute('width','6');wv.setAttribute('x','-12');wh.style.display='';wh.setAttribute('width','6');break;
    case 'basket': wv.setAttribute('width','4');wv.setAttribute('x','-2');wh.style.display='';wh.setAttribute('width','4');break;
    case 'single-post': wv.setAttribute('width','10');wv.setAttribute('x','-5');wh.style.display='none';break;
    case 'modified-trap': wv.setAttribute('width','8');wv.setAttribute('x','-4');wh.style.display='';wh.setAttribute('y','18');wh.setAttribute('width','28');break;
  }
  updateSummary();
}));

document.querySelectorAll('input[name="hand"]').forEach(r=>r.addEventListener('change',()=>{
  ST.hand=r.value;
  document.getElementById('gsvg').style.transform=r.value==='left'?'scaleX(-1)':'none';
  updateSummary();
}));
document.querySelectorAll('input[name="size"]').forEach(r=>r.addEventListener('change',()=>{ST.size=r.value;updateSummary();}));
document.querySelectorAll('input[name="stiff"]').forEach(r=>r.addEventListener('change',()=>{ST.stiff=r.value;updateSummary();}));

// ── Submit ────────────────────────────────────────────────────────────────────
async function doSubmit(){
  const t=T[lang];
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const errEl=document.getElementById('emailErr');
  if(!name){alert(t.nameErr);return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent=t.submitting;
  const payload={
    hand:ST.hand, size:ST.size, web:ST.web, stiffness:ST.stiff,
    colors:Object.fromEntries(Object.entries(ST.colors).map(([k,v])=>[k,v.n])),
    thumbText:document.getElementById('thumbTxt').value,
    pinkyText:document.getElementById('pinkyTxt').value,
    palmText:document.getElementById('palmTxt').value,
    wristText:document.getElementById('wristTxt').value,
    specialNotes:document.getElementById('notesTxt').value,
    customerName:name, customerEmail:email,
    customerPhone:document.getElementById('cPhone').value,
  };
  try{
    const res=await fetch('https://mao-agent.onrender.com/order',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
    });
    if(!res.ok)throw new Error('server error');
    document.querySelectorAll('.sc').forEach(el=>el.style.display='none');
    document.getElementById('succScreen').style.display='block';
    document.getElementById('succScreen').querySelector('[data-k="succTitle"]').textContent=t.succTitle;
    document.getElementById('succScreen').querySelector('[data-k="succMsg"]').textContent=t.succMsg;
  }catch(e){
    btn.disabled=false; btn.textContent=t.submit;
    alert('送出失敗，請稍後再試。');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildZones(); updateSummary();
</script>
</body>
</html>
