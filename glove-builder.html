<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手套客製化 | 阿男伍叁</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--accent:#c8a84b;--accent-dk:#8b6914;--text:#e8e8f0;--muted:#888899;--border:#2a2a3a;--ok:#2db87d;--r:12px;--t:.2s ease}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:15px}
.logo h1{font-size:15px;font-weight:700}
.logo p{font-size:11px;color:var(--muted)}
.langs{display:flex;gap:3px;background:var(--surface2);border-radius:8px;padding:3px}
.lb{padding:5px 11px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted);transition:var(--t)}
.lb.on{background:var(--accent);color:#000}
.steps{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;overflow-x:auto}
.stab{padding:13px 18px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap}
.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.stab.done{color:var(--text)}
.snum{width:20px;height:20px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.stab.on .snum{background:var(--accent);color:#000}
.stab.done .snum{background:var(--ok);color:#fff}
.main{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 108px)}
.opts{padding:28px 24px;border-right:1px solid var(--border)}
.sc{display:none;animation:fi .25s ease}
.sc.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slabel{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.og{margin-bottom:24px}
.olabel{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.req{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.rg{display:flex;flex-wrap:wrap;gap:7px}
.ro{position:relative}
.ro input{position:absolute;opacity:0;width:0;height:0}
.ro label{display:flex;align-items:center;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;transition:var(--t);background:var(--surface);line-height:1}
.ro input:checked+label{border-color:var(--accent);background:rgba(200,168,75,.12);color:var(--accent)}
.ro label:hover{border-color:var(--accent-dk)}
.czones{display:flex;flex-direction:column;gap:14px}
.czone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.czone-hdr{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cprev{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;transition:background .15s}
.czone-name{font-size:13px;font-weight:600}
.cname-cur{font-size:11px;color:var(--muted);margin-left:auto}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sw{width:56px;height:56px;border-radius:10px;border:2.5px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s;flex-shrink:0}
.sw-wrap:hover .sw{transform:scale(1.1);box-shadow:0 0 0 2px var(--accent-dk)}
.sw-wrap.on .sw{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw-lbl{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;max-width:60px;word-break:break-word}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:13px;transition:var(--t)}
.inp:focus{outline:none;border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
textarea.inp{height:90px;resize:vertical;font-family:inherit}
.err{color:#e05c5c;font-size:11px;margin-top:5px;display:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.btn{padding:11px 26px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:var(--t)}
.btn-p{background:var(--accent);color:#000}
.btn-p:hover{background:#d9b958}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-s:hover{border-color:var(--accent-dk)}
.preview{padding:28px 18px;position:sticky;top:108px;height:calc(100vh - 108px);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.pvlabel{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.gbox{background:#0f0f18;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;height:280px}
.gbox canvas{display:block}
.vbtns{display:flex;gap:6px;margin-top:10px}
.vbtn{flex:1;padding:7px 0;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;transition:var(--t)}
.vbtn:hover,.vbtn.on{background:var(--accent);color:#000;border-color:var(--accent)}
.drag-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:7px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.scardtitle{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.srow:last-child{border-bottom:none}
.skey{color:var(--muted)}
.sval{font-weight:600;display:flex;align-items:center;gap:5px}
.sdot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.succ{display:none;text-align:center;padding:60px 20px}
.succ-icon{width:72px;height:72px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:32px}
.succ h2{font-size:22px;margin-bottom:10px}
.succ p{color:var(--muted);line-height:1.6;font-size:14px}
@media(max-width:760px){.main{grid-template-columns:1fr}.preview{position:static;height:auto;border-top:1px solid var(--border)}.stab .slbl{display:none}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-icon">53</div>
    <div><h1 id="bname">阿男伍叁</h1><p id="bsub">手套客製化</p></div>
  </div>
  <div class="langs">
    <button class="lb on" onclick="setLang('zh')">中文</button>
    <button class="lb" onclick="setLang('en')">EN</button>
    <button class="lb" onclick="setLang('ja')">日本語</button>
  </div>
</header>

<div class="steps">
  <div class="stab on" id="tab1"><div class="snum">1</div><span class="slbl" data-k="step1">基本配置</span></div>
  <div class="stab" id="tab2"><div class="snum">2</div><span class="slbl" data-k="step2">顏色選擇</span></div>
  <div class="stab" id="tab3"><div class="snum">3</div><span class="slbl" data-k="step3">個人刺繡</span></div>
  <div class="stab" id="tab4"><div class="snum">4</div><span class="slbl" data-k="step4">訂購資訊</span></div>
</div>

<div class="main">
<div class="opts">

  <div class="sc on" id="s1">
    <p class="slabel" data-k="step1">基本配置</p>
    <div class="og">
      <div class="olabel"><span data-k="throwHand">慣用手</span><div class="req"></div></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="hand" id="hr" value="right" checked><label for="hr" data-k="rHand">右投（戴左手）</label></div>
        <div class="ro"><input type="radio" name="hand" id="hl" value="left"><label for="hl" data-k="lHand">左投（戴右手）</label></div>
      </div>
    </div>
    <div class="og">
      <div class="olabel"><span data-k="size">尺寸</span><div class="req"></div></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="size" id="s11" value='11"'><label for="s11">11"</label></div>
        <div class="ro"><input type="radio" name="size" id="s1125" value='11.25"' checked><label for="s1125">11.25"</label></div>
        <div class="ro"><input type="radio" name="size" id="s115" value='11.5"'><label for="s115">11.5"</label></div>
        <div class="ro"><input type="radio" name="size" id="s1175" value='11.75"'><label for="s1175">11.75"</label></div>
        <div class="ro"><input type="radio" name="size" id="s12" value='12"'><label for="s12">12"</label></div>
        <div class="ro"><input type="radio" name="size" id="s125" value='12.5"'><label for="s125">12.5"</label></div>
      </div>
    </div>
    <div class="og">
      <div class="olabel"><span data-k="webStyle">網型</span><div class="req"></div></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="web" id="wi" value="i-web" checked><label for="wi" data-wk="i-web">I 型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wh" value="h-web"><label for="wh" data-wk="h-web">H 型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wb" value="basket"><label for="wb" data-wk="basket">籃型網</label></div>
        <div class="ro"><input type="radio" name="web" id="wsp" value="single-post"><label for="wsp" data-wk="single-post">單柱網</label></div>
        <div class="ro"><input type="radio" name="web" id="wmt" value="modified-trap"><label for="wmt" data-wk="modified-trap">修改型梯形網</label></div>
      </div>
    </div>
    <div class="og">
      <div class="olabel"><span data-k="stiffness">手套硬度</span></div>
      <div class="rg">
        <div class="ro"><input type="radio" name="stiff" id="shd" value="stiff"><label for="shd" data-k="stiff">硬</label></div>
        <div class="ro"><input type="radio" name="stiff" id="smd" value="medium" checked><label for="smd" data-k="medium">中</label></div>
        <div class="ro"><input type="radio" name="stiff" id="sft" value="soft"><label for="sft" data-k="soft">軟</label></div>
      </div>
    </div>
    <div class="nav"><div></div><button class="btn btn-p" onclick="go(2)" data-k="next">下一步</button></div>
  </div>

  <div class="sc" id="s2">
    <p class="slabel" data-k="step2">顏色選擇</p>
    <div class="czones" id="czones"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(1)" data-k="prev">上一步</button>
      <button class="btn btn-p" onclick="go(3)" data-k="next">下一步</button>
    </div>
  </div>

  <div class="sc" id="s3">
    <p class="slabel" data-k="step3">個人刺繡</p>
    <div class="og"><div class="olabel"><span data-k="thumbTxt">拇指刺繡文字</span></div><input class="inp" id="thumbTxt" maxlength="15"></div>
    <div class="og"><div class="olabel"><span data-k="pinkyTxt">尾指刺繡文字</span></div><input class="inp" id="pinkyTxt" maxlength="15"></div>
    <div class="og"><div class="olabel"><span data-k="palmTxt">掌心印字</span></div><input class="inp" id="palmTxt" maxlength="20"></div>
    <div class="og"><div class="olabel"><span data-k="wristTxt">腕帶文字</span></div><input class="inp" id="wristTxt" maxlength="20"></div>
    <div class="og"><div class="olabel"><span data-k="notes">特殊需求</span></div><textarea class="inp" id="notesTxt"></textarea></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(2)" data-k="prev">上一步</button>
      <button class="btn btn-p" onclick="go(4)" data-k="next">下一步</button>
    </div>
  </div>

  <div class="sc" id="s4">
    <p class="slabel" data-k="step4">訂購資訊</p>
    <div class="og"><div class="olabel"><span data-k="cName">姓名</span><div class="req"></div></div><input class="inp" id="cName"></div>
    <div class="og">
      <div class="olabel"><span data-k="cEmail">Email</span><div class="req"></div></div>
      <input class="inp" type="email" id="cEmail">
      <p class="err" id="emailErr" data-k="emailErr">Email 格式不正確</p>
    </div>
    <div class="og"><div class="olabel"><span data-k="cPhone">電話</span></div><input class="inp" type="tel" id="cPhone"></div>
    <div class="nav">
      <button class="btn btn-s" onclick="go(3)" data-k="prev">上一步</button>
      <button class="btn btn-p" id="submitBtn" onclick="doSubmit()" data-k="submit">送出訂單</button>
    </div>
  </div>

  <div class="succ" id="succScreen">
    <div class="succ-icon">✓</div>
    <h2 data-k="succTitle">訂單已送出！</h2>
    <p data-k="succMsg">我們將在 2 個工作天內與您聯繫確認報價。</p>
  </div>

</div>

<!-- Preview -->
<div class="preview">
  <div>
    <p class="pvlabel" data-k="preview">預覽</p>
    <div class="gbox" id="canvasBox"><canvas id="gloveCanvas"></canvas></div>
    <div class="vbtns">
      <button class="vbtn on" onclick="setView('front')" data-k="vFront">正面</button>
      <button class="vbtn" onclick="setView('side')" data-k="vSide">側面</button>
      <button class="vbtn" onclick="setView('back')" data-k="vBack">背面</button>
      <button class="vbtn" onclick="setView('top')" data-k="vTop">頂視</button>
    </div>
    <p class="drag-hint" data-k="dragHint">拖曳旋轉</p>
  </div>
  <div class="scard">
    <p class="scardtitle" data-k="summary">配置摘要</p>
    <div id="srows"></div>
  </div>
</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── i18n ─────────────────────────────────────────────────────────────────────
const T = {
  zh:{brand:'阿男伍叁',bsub:'手套客製化',step1:'基本配置',step2:'顏色選擇',step3:'個人刺繡',step4:'訂購資訊',throwHand:'慣用手',rHand:'右投（戴左手）',lHand:'左投（戴右手）',size:'尺寸',webStyle:'網型',stiffness:'手套硬度',stiff:'硬',medium:'中',soft:'軟',back:'外皮',palm:'掌心',web:'網',laces:'綁帶',binding:'邊框',stitching:'縫線',thumbTxt:'拇指刺繡文字',pinkyTxt:'尾指刺繡文字',palmTxt:'掌心印字',wristTxt:'腕帶文字',notes:'特殊需求',cName:'姓名',cEmail:'Email',cPhone:'電話',submit:'送出訂單',submitting:'送出中...',succTitle:'訂單已送出！',succMsg:'我們將在 2 個工作天內與您聯繫確認報價。',preview:'預覽',summary:'配置摘要',next:'下一步',prev:'上一步',emailErr:'Email 格式不正確',nameErr:'請填寫姓名',vFront:'正面',vSide:'側面',vBack:'背面',vTop:'頂視',dragHint:'拖曳旋轉',ws:{'i-web':'I 型網','h-web':'H 型網','basket':'籃型網','single-post':'單柱網','modified-trap':'修改型梯形網'},sl:{stiff:'硬',medium:'中',soft:'軟'},hl:{right:'右投',left:'左投'}},
  en:{brand:'A-Nan 53',bsub:'Glove Customizer',step1:'Base Setup',step2:'Colors',step3:'Personalize',step4:'Order Info',throwHand:'Throwing Hand',rHand:'Right Hand Throw',lHand:'Left Hand Throw',size:'Size',webStyle:'Web Style',stiffness:'Stiffness',stiff:'Stiff',medium:'Medium',soft:'Soft',back:'Back Leather',palm:'Palm',web:'Web',laces:'Laces',binding:'Binding',stitching:'Stitching',thumbTxt:'Thumb Embroidery',pinkyTxt:'Pinky Embroidery',palmTxt:'Palm Stamp',wristTxt:'Wrist Text',notes:'Special Instructions',cName:'Name',cEmail:'Email',cPhone:'Phone',submit:'Submit Order',submitting:'Submitting...',succTitle:'Order Submitted!',succMsg:'We will contact you within 2 business days.',preview:'Preview',summary:'Configuration',next:'Next',prev:'Back',emailErr:'Invalid email format',nameErr:'Please enter your name',vFront:'Front',vSide:'Side',vBack:'Back',vTop:'Top',dragHint:'Drag to rotate',ws:{'i-web':'I-Web','h-web':'H-Web','basket':'Basket Web','single-post':'Single Post','modified-trap':'Modified Trap'},sl:{stiff:'Stiff',medium:'Medium',soft:'Soft'},hl:{right:'Right',left:'Left'}},
  ja:{brand:'アーナン53',bsub:'グローブカスタマイズ',step1:'基本設定',step2:'カラー選択',step3:'刺繍',step4:'注文情報',throwHand:'利き手',rHand:'右投げ',lHand:'左投げ',size:'サイズ',webStyle:'ウェブ',stiffness:'硬さ',stiff:'硬い',medium:'普通',soft:'柔らかい',back:'背革',palm:'手のひら革',web:'ウェブ',laces:'レース',binding:'バインディング',stitching:'ステッチ',thumbTxt:'親指刺繍',pinkyTxt:'小指刺繍',palmTxt:'パームスタンプ',wristTxt:'リスト文字',notes:'特記事項',cName:'お名前',cEmail:'メールアドレス',cPhone:'電話番号',submit:'注文を送信',submitting:'送信中...',succTitle:'注文を受け付けました！',succMsg:'2営業日以内にご連絡いたします。',preview:'プレビュー',summary:'設定内容',next:'次へ',prev:'戻る',emailErr:'メールアドレスの形式が正しくありません',nameErr:'お名前を入力してください',vFront:'正面',vSide:'側面',vBack:'背面',vTop:'上面',dragHint:'ドラッグで回転',ws:{'i-web':'I型ウェブ','h-web':'H型ウェブ','basket':'バスケットウェブ','single-post':'シングルポスト','modified-trap':'変形トラップ'},sl:{stiff:'硬い',medium:'普通',soft:'柔らかい'},hl:{right:'右投げ',left:'左投げ'}}
};

// ── Colors ────────────────────────────────────────────────────────────────────
const COLORS=[
  {k:'black',   h:'#1A1A1A', n:'Black'},
  {k:'grey',    h:'#5A5A5A', n:'Grey'},
  {k:'white',   h:'#F2EDE4', n:'White'},
  {k:'blonde',  h:'#E8D49A', n:'Blonde'},
  {k:'lavender',h:'#B4A8CC', n:'Lavender'},
  {k:'yellow',  h:'#F0CC00', n:'Yellow'},
  {k:'tan',     h:'#D2B48C', n:'Tan'},
  {k:'camel',   h:'#C19A6B', n:'Camel'},
  {k:'orange',  h:'#E05C00', n:'Orange'},
  {k:'orange-tan',h:'#C87040',n:'Orange Tan'},
  {k:'chestnut',h:'#3A1A08', n:'Oiled Chestnut'},
  {k:'brown',   h:'#5C3010', n:'Brown'},
  {k:'red',     h:'#CC0000', n:'Red'},
  {k:'maroon',  h:'#800020', n:'Maroon'},
  {k:'pink',    h:'#E87FA0', n:'Pink'},
  {k:'purple',  h:'#5C1A8A', n:'Purple'},
  {k:'navy',    h:'#0B2167', n:'Navy Blue'},
  {k:'royal',   h:'#1A4BBF', n:'Royal Blue'},
  {k:'sky',     h:'#29A8D4', n:'Sky Blue'},
  {k:'green',   h:'#1A5C1A', n:'Forest'},
  {k:'mint',    h:'#7ECBA0', n:'Mint'},
  {k:'gold',    h:'#D4A017', n:'Gold'},
];

const ZONES=[
  {id:'back',  dk:'camel'},
  {id:'palm',  dk:'camel'},
  {id:'web',   dk:'brown'},
  {id:'laces', dk:'camel'},
  {id:'binding',dk:'gold'},
  {id:'stitching',dk:'brown'},
];

// ── State ─────────────────────────────────────────────────────────────────────
let lang='zh';
const ST={
  hand:'right',size:'11.25"',web:'i-web',stiff:'medium',
  colors:Object.fromEntries(ZONES.map(z=>[z.id,COLORS.find(c=>c.k===z.dk)])),
};

// ── Three.js ──────────────────────────────────────────────────────────────────
const canvas=document.getElementById('gloveCanvas');
const box=document.getElementById('canvasBox');
const W=box.clientWidth, H=box.clientHeight;
canvas.width=W; canvas.height=H;

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0f0f18);
scene.fog=new THREE.Fog(0x0f0f18,12,20);

const camera=new THREE.PerspectiveCamera(40,W/H,0.1,50);
camera.position.set(0,0.4,5.2);

const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;
controls.dampingFactor=0.07;
controls.enableZoom=false;
controls.enablePan=false;
controls.minPolarAngle=Math.PI*0.15;
controls.maxPolarAngle=Math.PI*0.85;
controls.target.set(0,0.15,0);

// Lighting
const ambient=new THREE.AmbientLight(0xfff8f0,0.55);
scene.add(ambient);

const sun=new THREE.DirectionalLight(0xfff5e0,2.0);
sun.position.set(3,6,5);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near=0.5;
sun.shadow.camera.far=20;
scene.add(sun);

const fill=new THREE.DirectionalLight(0xd0e8ff,0.5);
fill.position.set(-4,3,-2);
scene.add(fill);

const rim=new THREE.DirectionalLight(0xffe8c0,0.35);
rim.position.set(0,-3,-5);
scene.add(rim);

// Ground (for shadow)
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(10,10),
  new THREE.ShadowMaterial({opacity:0.18})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-2.2;
ground.receiveShadow=true;
scene.add(ground);

// ── Materials (shared, update color in-place) ─────────────────────────────────
function mkMat(hex,rough=0.82,metal=0.04){
  return new THREE.MeshStandardMaterial({
    color:new THREE.Color(hex),roughness:rough,metalness:metal
  });
}
const mats={
  back:     mkMat('#C19A6B'),
  palm:     mkMat('#C19A6B'),
  web:      mkMat('#8B6914',0.88,0.02),
  laces:    mkMat('#C19A6B',0.78,0.06),
  binding:  mkMat('#D4A017',0.65,0.12),
  stitching:mkMat('#7A5C10',0.92,0.01),
  thumb:    mkMat('#C19A6B'),  // same as back by default (share back color)
};
// thumb shares back color by default
mats.thumb=mats.back;

// ── Glove group ───────────────────────────────────────────────────────────────
const glove=new THREE.Group();
glove.rotation.x=0.08;  // slight tilt forward
scene.add(glove);

function addShadow(m){m.castShadow=true;m.receiveShadow=true;return m;}

// Helper: build a capsule-like shape (cylinder + two half-spheres)
function mkCapsule(rTop,rBot,h,mat,seg=20){
  const g=new THREE.Group();
  const cyl=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBot,h,seg),mat));
  const top=addShadow(new THREE.Mesh(new THREE.SphereGeometry(rTop,seg,10,0,Math.PI*2,0,Math.PI/2),mat));
  top.position.y=h/2;
  const bot=addShadow(new THREE.Mesh(new THREE.SphereGeometry(rBot,seg,10,0,Math.PI*2,Math.PI/2,Math.PI/2),mat));
  bot.position.y=-h/2;
  g.add(cyl,top,bot);
  return g;
}

// ── Main body ─────────────────────────────────────────────────────────────────
const bodyGeo=new THREE.SphereGeometry(1,48,32);
const body=addShadow(new THREE.Mesh(bodyGeo,mats.back));
body.scale.set(1.08,1.38,0.54);
body.position.set(-0.06,0.02,0);
glove.add(body);

// ── Wrist ─────────────────────────────────────────────────────────────────────
const wrist=addShadow(new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.44,0.42,24),mats.back));
wrist.position.set(-0.06,-1.28,0);
glove.add(wrist);

// Wrist cap (bottom)
const wristCap=addShadow(new THREE.Mesh(new THREE.SphereGeometry(0.44,24,12,0,Math.PI*2,Math.PI/2,Math.PI/2),mats.back));
wristCap.position.set(-0.06,-1.49,0);
glove.add(wristCap);

// ── Binding strip around wrist ────────────────────────────────────────────────
const bindTorus=addShadow(new THREE.Mesh(new THREE.TorusGeometry(0.44,0.025,10,40),mats.binding));
bindTorus.position.set(-0.06,-1.09,0);
bindTorus.rotation.x=Math.PI/2;
glove.add(bindTorus);

// ── Fingers ───────────────────────────────────────────────────────────────────
// Each finger: [x offset, y base, height, radius, z-rotation degrees]
const fingerDefs=[
  [-0.43, 1.22, 0.50, 0.107, 13],   // Pinky
  [-0.14, 1.30, 0.61, 0.116, 4],    // Ring
  [ 0.17, 1.34, 0.67, 0.120, -2],   // Middle (tallest)
  [ 0.46, 1.28, 0.59, 0.113, -13],  // Index
];
fingerDefs.forEach(([fx,fy,fh,fr,fang])=>{
  const f=mkCapsule(fr,fr*0.86,fh,mats.back);
  f.position.set(fx, fy+fh/2, 0.06);
  f.rotation.z=fang*Math.PI/180;
  glove.add(f);
});

// Finger binding (edge strips at fingertip boundary)
[-0.43,-0.14,0.17,0.46].forEach((fx,i)=>{
  const bt=addShadow(new THREE.Mesh(new THREE.TorusGeometry(0.113-i*0.003,0.018,8,24),mats.binding));
  const fy=[1.22,1.30,1.34,1.28][i];
  bt.position.set(fx,fy-0.02,0.06);
  bt.rotation.x=Math.PI/2;
  glove.add(bt);
});

// ── Thumb ─────────────────────────────────────────────────────────────────────
const thumb=mkCapsule(0.136,0.116,0.60,mats.back);
thumb.position.set(1.14,0.56,0.04);
thumb.rotation.z=-66*Math.PI/180;
glove.add(thumb);

// Thumb binding
const thumbBind=addShadow(new THREE.Mesh(new THREE.TorusGeometry(0.116,0.020,8,24),mats.binding));
thumbBind.position.set(0.73,0.85,0.04);
thumbBind.rotation.z=(-66+90)*Math.PI/180;
thumbBind.rotation.x=Math.PI/2;
glove.add(thumbBind);

// ── Web (I-Web between index and thumb) ──────────────────────────────────────
// Web base area (leather triangle)
const webShape=new THREE.Shape();
webShape.moveTo(0,0); webShape.lineTo(-0.12,0.38); webShape.lineTo(0.12,0.38); webShape.closePath();
const webBase=addShadow(new THREE.Mesh(new THREE.ShapeGeometry(webShape),mats.web));
webBase.position.set(0.82,1.00,0.14);
webBase.rotation.z=-18*Math.PI/180;
webBase.rotation.x=-10*Math.PI/180;
glove.add(webBase);

// Web vertical bar (I-Web)
const webV=addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.055,0.36,0.03),mats.web));
webV.position.set(0.82,1.08,0.18);
webV.rotation.z=-18*Math.PI/180;
glove.add(webV);

// Web horizontal bar
const webH=addShadow(new THREE.Mesh(new THREE.BoxGeometry(0.26,0.055,0.03),mats.web));
webH.position.set(0.82,1.10,0.18);
webH.rotation.z=-18*Math.PI/180;
glove.add(webH);

// ── Palm overlay ──────────────────────────────────────────────────────────────
const palmGeo=new THREE.SphereGeometry(0.88,32,24,0,Math.PI*2,Math.PI*0.42,Math.PI*0.52);
const palm=addShadow(new THREE.Mesh(palmGeo,mats.palm));
palm.scale.set(1.08,1.38,0.54);
palm.position.set(-0.06,0.02,0.008);
glove.add(palm);

// ── Laces (between fingers) ───────────────────────────────────────────────────
function mkLace(x,y,z,rz){
  const g=new THREE.Group();
  const main=addShadow(new THREE.Mesh(new THREE.TorusGeometry(0.07,0.018,8,18,Math.PI),mats.laces));
  g.add(main);
  g.position.set(x,y,z);
  g.rotation.z=rz;
  glove.add(g);
}
mkLace(-0.28,1.22,0.14, 0.18);
mkLace( 0.02,1.30,0.14, 0.06);
mkLace( 0.30,1.27,0.14,-0.10);
// Side laces
mkLace(-0.98,0.45,0.06, 1.45);
mkLace(-1.01,0.10,0.06, 1.52);
mkLace(-0.98,-0.28,0.06,1.60);

// ── Stitching (decorative lines on palm) ─────────────────────────────────────
function mkStitch(pts,mat){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const m=addShadow(new THREE.Mesh(new THREE.TubeGeometry(curve,20,0.012,6,false),mat));
  glove.add(m);
}
mkStitch([[-0.55,0.08,0.54],[-0.06,-0.08,0.56],[0.44,0.08,0.54]],mats.stitching);
mkStitch([[-0.55,-0.25,0.54],[-0.06,-0.40,0.56],[0.44,-0.25,0.54]],mats.stitching);

// ── View presets ──────────────────────────────────────────────────────────────
const views={
  front:{pos:[0,0.4,5.2],  target:[0,0.15,0]},
  back: {pos:[0,0.4,-5.2], target:[0,0.15,0]},
  side: {pos:[4.5,0.4,1.5],target:[0,0.15,0]},
  top:  {pos:[0,5.5,0.5],  target:[0,0.15,0]},
};

window.setView=function(v){
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  const vd=views[v];
  camera.position.set(...vd.pos);
  controls.target.set(...vd.target);
  controls.update();
};

// ── Animation ─────────────────────────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
})();

// ── Update color (Three.js material) ─────────────────────────────────────────
window.pickColor=function(zid,ck){
  const color=COLORS.find(c=>c.k===ck);
  ST.colors[zid]=color;
  document.querySelectorAll(`.sw-wrap[data-z="${zid}"]`).forEach(s=>s.classList.toggle('on',s.dataset.k===ck));
  const cp=document.getElementById('cp-'+zid); if(cp)cp.style.background=color.h;
  const cn=document.getElementById('cn-'+zid); if(cn)cn.textContent=color.n;
  // Update Three.js material
  if(mats[zid]) mats[zid].color.set(color.h);
  // back also drives thumb (same material)
  if(zid==='back') mats.thumb.color.set(color.h);
  updateSummary();
};

// Flip glove for left-handed
document.querySelectorAll('input[name="hand"]').forEach(r=>r.addEventListener('change',()=>{
  ST.hand=r.value;
  glove.scale.x=r.value==='left'?-1:1;
  updateSummary();
}));
document.querySelectorAll('input[name="size"]').forEach(r=>r.addEventListener('change',()=>{ST.size=r.value;updateSummary();}));
document.querySelectorAll('input[name="web"]').forEach(r=>r.addEventListener('change',()=>{ST.web=r.value;updateSummary();}));
document.querySelectorAll('input[name="stiff"]').forEach(r=>r.addEventListener('change',()=>{ST.stiff=r.value;updateSummary();}));

// ── Language ──────────────────────────────────────────────────────────────────
window.setLang=function(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',
    (l==='zh'&&b.textContent.includes('中'))||(l==='en'&&b.textContent==='EN')||(l==='ja'&&b.textContent.includes('日'))));
  const t=T[l];
  document.getElementById('bname').textContent=t.brand;
  document.getElementById('bsub').textContent=t.bsub;
  document.title=`${t.bsub} | ${t.brand}`;
  document.querySelectorAll('[data-k]').forEach(el=>{const v=t[el.dataset.k];if(v)el.textContent=v;});
  document.querySelectorAll('[data-wk]').forEach(el=>{const v=t.ws[el.dataset.wk];if(v)el.textContent=v;});
  buildZones(); updateSummary();
};

// ── Step nav ──────────────────────────────────────────────────────────────────
window.go=function(n){
  document.querySelectorAll('.sc').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.stab').forEach((t,i)=>{
    t.classList.remove('on','done');
    if(i+1<n)t.classList.add('done');
    if(i+1===n)t.classList.add('on');
  });
  const el=document.getElementById('s'+n); if(el)el.classList.add('on');
  updateSummary();
};

// ── Color zones UI ────────────────────────────────────────────────────────────
function buildZones(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const c=document.getElementById('czones'); c.innerHTML='';
  ZONES.forEach(z=>{
    const sel=ST.colors[z.id];
    const d=document.createElement('div'); d.className='czone';
    d.innerHTML=`<div class="czone-hdr"><div class="cprev" id="cp-${z.id}" style="background:${sel.h}"></div><span class="czone-name">${zl[z.id]}</span><span class="cname-cur" id="cn-${z.id}">${sel.n}</span></div><div class="swatches">${COLORS.map(c=>`<div class="sw-wrap${c.k===sel.k?' on':''}" data-z="${z.id}" data-k="${c.k}" onclick="pickColor('${z.id}','${c.k}')"><div class="sw" style="background:${c.h};${c.h==='#F2EDE4'?'border-color:#3a3a4a;':''}" title="${c.n}"></div><span class="sw-lbl">${c.n}</span></div>`).join('')}</div>`;
    c.appendChild(d);
  });
}

function updateSummary(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const rows=[
    {k:t.throwHand,v:t.hl[ST.hand]},
    {k:t.size,v:ST.size},
    {k:t.webStyle,v:t.ws[ST.web]},
    {k:t.stiffness,v:t.sl[ST.stiff]},
    ...ZONES.map(z=>({k:zl[z.id],v:ST.colors[z.id]?.n,c:ST.colors[z.id]?.h})),
  ];
  document.getElementById('srows').innerHTML=rows.map(r=>`<div class="srow"><span class="skey">${r.k}</span><span class="sval">${r.c?`<span class="sdot" style="background:${r.c}"></span>`:''} ${r.v||'—'}</span></div>`).join('');
}

async function doSubmit(){
  const t=T[lang];
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const errEl=document.getElementById('emailErr');
  if(!name){alert(t.nameErr);return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.textContent=t.submitting;
  const payload={
    hand:ST.hand,size:ST.size,web:ST.web,stiffness:ST.stiff,
    colors:Object.fromEntries(Object.entries(ST.colors).map(([k,v])=>[k,v.n])),
    thumbText:document.getElementById('thumbTxt').value,
    pinkyText:document.getElementById('pinkyTxt').value,
    palmText:document.getElementById('palmTxt').value,
    wristText:document.getElementById('wristTxt').value,
    specialNotes:document.getElementById('notesTxt').value,
    customerName:name,customerEmail:email,
    customerPhone:document.getElementById('cPhone').value,
  };
  try{
    const res=await fetch('https://mao-agent.onrender.com/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('server error');
    document.querySelectorAll('.sc').forEach(el=>el.style.display='none');
    const sc=document.getElementById('succScreen'); sc.style.display='block';
    sc.querySelector('[data-k="succTitle"]').textContent=t.succTitle;
    sc.querySelector('[data-k="succMsg"]').textContent=t.succMsg;
  }catch(e){btn.disabled=false;btn.textContent=t.submit;alert('送出失敗，請稍後再試。');}
}
window.doSubmit=doSubmit;

buildZones(); updateSummary();
</script>
</body>
</html>
