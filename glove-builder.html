<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手套客製化 | 阿男伍叁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EE;--surface:#FFF;--surface2:#F0EBE4;
  --accent:#9B7250;--accent-dk:#7A5438;--accent-lt:#F5EDE3;
  --text:#1C1A18;--muted:#8C8078;--border:#DDD4C8;--ok:#2A9E6A;
  --r:4px;--t:.2s ease;
  --gv-back:#C19A6B;--gv-palm:#C19A6B;--gv-web:#5C3010;
  --gv-laces:#C19A6B;--gv-binding:#D4A017;--gv-stitching:#8B6914;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:16px}
.logo img{height:54px;width:auto}
.logo-sep{width:1px;height:36px;background:var(--border)}
.logo-sub{font-family:'Fahkwang',sans-serif;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.5px}
.logo-sub small{display:block;font-family:'Montserrat',sans-serif;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.langs{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lb{padding:6px 13px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Montserrat',sans-serif;background:transparent;color:var(--muted);transition:var(--t);border-right:1px solid var(--border)}
.lb:last-child{border-right:none}
.lb.on{background:var(--accent);color:#fff}
.lb:hover:not(.on){background:var(--surface2)}
.steps{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;overflow-x:auto}
.stab{padding:14px 20px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap;letter-spacing:.3px}
.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.stab.done{color:var(--text)}
.snum{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.stab.on .snum{background:var(--accent);color:#fff;border-color:var(--accent)}
.stab.done .snum{background:var(--ok);color:#fff;border-color:var(--ok)}
.main{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 114px)}
.opts{padding:32px 28px;border-right:1px solid var(--border);background:var(--bg)}
.sc{display:none;animation:fi .2s ease}
.sc.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.slabel{font-family:'Fahkwang',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.og{margin-bottom:28px}
.olabel{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.req{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.rg{display:flex;flex-wrap:wrap;gap:8px}
.ro{position:relative}
.ro input{position:absolute;opacity:0;width:0;height:0}
.ro label{display:flex;align-items:center;padding:9px 16px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:500;transition:var(--t);background:var(--surface);color:var(--text);line-height:1}
.ro input:checked+label{border-color:var(--accent);background:var(--accent-lt);color:var(--accent);font-weight:700}
.ro label:hover{border-color:var(--accent-dk);background:var(--accent-lt)}
.czones{display:flex;flex-direction:column;gap:16px}
.czone{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.czone-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cprev{width:28px;height:28px;border-radius:var(--r);border:1.5px solid var(--border);flex-shrink:0;transition:background .15s}
.czone-name{font-size:13px;font-weight:600}
.cname-cur{font-size:11px;color:var(--muted);margin-left:auto;font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sw{width:52px;height:52px;border-radius:8px;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sw-wrap:hover .sw{transform:scale(1.08);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.sw-wrap.on .sw{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,114,80,.25)}
.sw-lbl{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;max-width:56px;word-break:break-word;font-weight:500}
.sw-wrap.on .sw-lbl{color:var(--accent);font-weight:700}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 13px;color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;transition:var(--t)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,114,80,.1)}
.inp::placeholder{color:var(--muted)}
textarea.inp{height:90px;resize:vertical}
.err{color:#C0392B;font-size:11px;margin-top:5px;display:none;font-weight:500}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.btn{padding:12px 28px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;transition:var(--t);letter-spacing:.3px}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-dk)}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn-s:hover{border-color:var(--accent);color:var(--accent)}
.preview{padding:28px 20px;position:sticky;top:114px;height:calc(100vh - 114px);overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--surface);border-left:1px solid var(--border)}
.pvlabel{font-family:'Fahkwang',sans-serif;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.gbox{background:#F8F3EC;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;height:300px;display:flex;align-items:center;justify-content:center;position:relative}
#gcanvas{display:block;width:100%;height:100%}
.vbtns{display:flex;gap:5px;margin-top:10px}
.vbtn{flex:1;padding:7px 0;border-radius:var(--r);border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;font-family:'Montserrat',sans-serif;transition:var(--t)}
.vbtn:hover,.vbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.scard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.scardtitle{font-family:'Fahkwang',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.srow:last-child{border-bottom:none}
.skey{color:var(--muted);font-weight:500}
.sval{font-weight:700;display:flex;align-items:center;gap:5px}
.sdot{width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid rgba(0,0,0,.1)}
.succ{display:none;text-align:center;padding:60px 20px}
.succ-icon{width:72px;height:72px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:32px;color:#fff}
.succ h2{font-family:'Fahkwang',sans-serif;font-size:22px;margin-bottom:10px}
.succ p{color:var(--muted);line-height:1.7;font-size:14px}
@media(max-width:760px){.main{grid-template-columns:1fr}.preview{position:static;height:auto;border-left:none;border-top:1px solid var(--border)}.stab .slbl{display:none}}
</style>

};

const COLORS=[

  {k:'white',h:'#F2EDE4',n:'White'},{k:'blonde',h:'#E8D49A',n:'Blonde'},
  {k:'lavender',h:'#B4A8CC',n:'Lavender'},{k:'yellow',h:'#F0CC00',n:'Yellow'},
  {k:'tan',h:'#D2B48C',n:'Tan'},{k:'camel',h:'#C19A6B',n:'Camel'},
  {k:'orange',h:'#E05C00',n:'Orange'},{k:'orange-tan',h:'#C87040',n:'Orange Tan'},
  {k:'chestnut',h:'#3A1A08',n:'Oiled Chestnut'},{k:'brown',h:'#5C3010',n:'Brown'},
  {k:'red',h:'#CC0000',n:'Red'},{k:'maroon',h:'#800020',n:'Maroon'},
  {k:'pink',h:'#E87FA0',n:'Pink'},{k:'purple',h:'#5C1A8A',n:'Purple'},
  {k:'navy',h:'#0B2167',n:'Navy Blue'},{k:'royal',h:'#1A4BBF',n:'Royal Blue'},
  {k:'sky',h:'#29A8D4',n:'Sky Blue'},{k:'green',h:'#1A5C1A',n:'Forest'},
  {k:'mint',h:'#7ECBA0',n:'Mint'},{k:'gold',h:'#D4A017',n:'Gold'}
];
const ZONES=[
  {id:'back',dk:'camel'},{id:'palm',dk:'camel'},{id:'web',dk:'brown'},
  {id:'laces',dk:'camel'},{id:'binding',dk:'gold'},{id:'stitching',dk:'brown'}
];
const CSS_MAP={back:'--gv-back',palm:'--gv-palm',web:'--gv-web',laces:'--gv-laces',binding:'--gv-binding',stitching:'--gv-stitching'};

let lang='zh';
const ST={
  hand:'right',size:'11.25"',web:'i-web',stiff:'medium',
  colors:Object.fromEntries(ZONES.map(z=>[z.id,COLORS.find(c=>c.k===z.dk)]))
};

// ── THREE.JS 3D GLOVE ──────────────────────────────────────────────────
const gcanvas=document.getElementById('gcanvas');
const renderer=new THREE.WebGLRenderer({canvas:gcanvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#F8F3EC');
const camera=new THREE.PerspectiveCamera(42,1,0.1,20);
camera.position.set(0,0.5,-6.5);
const controls=new THREE.OrbitControls(camera,gcanvas);
controls.enableDamping=true;controls.dampingFactor=0.07;
controls.minDistance=2.5;controls.maxDistance=11;
controls.target.set(0,0.4,0.21);controls.update();
scene.add(new THREE.AmbientLight(0xfff5e4,0.70));
const kL=new THREE.DirectionalLight(0xfffde8,1.15);kL.position.set(-1.5,3.5,-4);scene.add(kL);
const fL=new THREE.DirectionalLight(0xffe8cc,0.50);fL.position.set(1.5,2.0,4);scene.add(fL);
const rL=new THREE.DirectionalLight(0xfff0e0,0.25);rL.position.set(3,0,0);scene.add(rL);

const mats={
  back:new THREE.MeshStandardMaterial({color:'#C19A6B',roughness:0.80,metalness:0.04}),
  palm:new THREE.MeshStandardMaterial({color:'#C19A6B',roughness:0.75,metalness:0.04,side:THREE.FrontSide}),
  web:new THREE.MeshStandardMaterial({color:'#5C3010',roughness:0.82,metalness:0.02,side:THREE.DoubleSide}),
  laces:new THREE.MeshStandardMaterial({color:'#C19A6B',roughness:0.68,metalness:0.06}),
  binding:new THREE.MeshStandardMaterial({color:'#D4A017',roughness:0.62,metalness:0.08}),
  stitching:new THREE.MeshStandardMaterial({color:'#8B6914',roughness:0.88,metalness:0.01}),
};

const DEPTH=0.40;
const glove=new THREE.Group();
scene.add(glove);

// ── PALM BODY (elliptical extrusion) ──────────────────────────────────
const palmShape=new THREE.Shape();
palmShape.absellipse(0,-0.45,1.00,1.52,0,Math.PI*2,false,0);
glove.add(new THREE.Mesh(new THREE.ExtrudeGeometry(palmShape,{
  depth:DEPTH,bevelEnabled:true,bevelThickness:0.06,bevelSize:0.05,bevelSegments:4,curveSegments:32
}),mats.back));

// ── WRIST (below palm) ────────────────────────────────────────────────
const wristShape=new THREE.Shape();
wristShape.absellipse(0,0,0.56,0.26,0,Math.PI*2,false,0);
const wristM=new THREE.Mesh(new THREE.ExtrudeGeometry(wristShape,{depth:DEPTH,bevelEnabled:false,curveSegments:16}),mats.back);
wristM.position.set(0,-2.10,0);
glove.add(wristM);
// Connector strip palm → wrist
const connGeo=new THREE.BoxGeometry(1.10,0.42,DEPTH);
const connM=new THREE.Mesh(connGeo,mats.back);
connM.position.set(0,-1.94,DEPTH/2);
glove.add(connM);
// Wrist binding band
const wbShape=new THREE.Shape();
wbShape.absellipse(0,-2.10,0.58,0.28,0,Math.PI*2,false,0);
const wbM=new THREE.Mesh(new THREE.ShapeGeometry(wbShape,24),mats.binding);
wbM.position.z=-0.01;
glove.add(wbM);

// ── FINGER TUBES ──────────────────────────────────────────────────────
// [cx, baseY, tipY, radius]
const FDATA=[
  [-0.72, 0.94, 2.30, 0.150],  // pinky
  [-0.28, 0.88, 2.62, 0.168],  // ring
  [ 0.16, 0.84, 2.84, 0.185],  // middle
  [ 0.60, 0.88, 2.64, 0.170],  // index
];
const HZ=DEPTH/2;
FDATA.forEach(([cx,baseY,tipY,r])=>{
  const pts=[
    new THREE.Vector3(cx,baseY,HZ),
    new THREE.Vector3(cx,baseY+(tipY-baseY)*0.5,HZ+0.02),
    new THREE.Vector3(cx,tipY,HZ-0.05),
  ];
  const curve=new THREE.CatmullRomCurve3(pts);
  glove.add(new THREE.Mesh(new THREE.TubeGeometry(curve,14,r,10,false),mats.back));
  // Rounded fingertip
  const cap=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mats.back);
  cap.position.set(cx,tipY,HZ-0.05);
  glove.add(cap);
  // Binding ring at tip
  const bRing=new THREE.Mesh(new THREE.TorusGeometry(r+0.01,0.030,6,18),mats.binding);
  bRing.rotation.x=Math.PI/2;
  bRing.position.set(cx,tipY-0.06,HZ-0.05);
  glove.add(bRing);
});

// Finger gap lace dots
[[-0.50,1.30],[-0.50,1.10],[-0.06,1.32],[-0.06,1.12],[0.38,1.30],[0.38,1.10]].forEach(([x,y])=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.048,8,6),mats.laces);
  m.position.set(x,y,-0.04);glove.add(m);
});

// ── THUMB TUBE ────────────────────────────────────────────────────────
const thumbPts=[
  new THREE.Vector3(0.88,0.78,HZ),
  new THREE.Vector3(1.42,0.44,HZ-0.02),
  new THREE.Vector3(1.78,0.06,HZ-0.06),
];
const thumbCurve=new THREE.CatmullRomCurve3(thumbPts);
glove.add(new THREE.Mesh(new THREE.TubeGeometry(thumbCurve,14,0.235,10,false),mats.back));
const thumbCap=new THREE.Mesh(new THREE.SphereGeometry(0.235,10,8),mats.back);
thumbCap.position.set(1.78,0.06,HZ-0.06);
glove.add(thumbCap);
const thumbBand=new THREE.Mesh(new THREE.TorusGeometry(0.245,0.030,6,18),mats.binding);
thumbBand.rotation.x=Math.PI/2;
thumbBand.position.set(1.78,0.10,HZ-0.06);
glove.add(thumbBand);

// ── PALM LEATHER OVERLAY (front face) ────────────────────────────────
const palmLeatherShape=new THREE.Shape();
palmLeatherShape.absellipse(-0.04,-0.46,0.76,0.72,0,Math.PI*2,false,0);
const palmLeatherM=new THREE.Mesh(new THREE.ShapeGeometry(palmLeatherShape,48),mats.palm);
palmLeatherM.position.z=DEPTH+0.01;
glove.add(palmLeatherM);

// ── WEB GROUP ─────────────────────────────────────────────────────────
const webGroup=new THREE.Group();
glove.add(webGroup);

function addWebBar(x1,y1,x2,y2,z){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),hw=0.052;
  const nx=(-dy/len)*hw,ny=(dx/len)*hw;
  const s=new THREE.Shape();
  s.moveTo(x1+nx,y1+ny);s.lineTo(x2+nx,y2+ny);s.lineTo(x2-nx,y2-ny);s.lineTo(x1-nx,y1-ny);s.closePath();
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s,4),mats.web);
  m.position.z=z;webGroup.add(m);
}

function updateWeb(){
  while(webGroup.children.length)webGroup.remove(webGroup.children[0]);
  const W=-0.01;
  if(ST.web==='i-web'||ST.web==='single-post'){
    addWebBar(0.80,0.84,1.06,0.00,W);
    addWebBar(0.66,0.46,1.42,0.30,W);
  }else if(ST.web==='h-web'){
    addWebBar(0.78,0.84,0.86,0.00,W);
    addWebBar(0.96,0.84,1.04,0.00,W);
    addWebBar(0.64,0.44,1.40,0.28,W);
  }else{
    const bs=new THREE.Shape();
    bs.moveTo(0.72,0.86);bs.bezierCurveTo(0.96,0.88,1.36,0.70,1.42,0.38);
    bs.bezierCurveTo(1.48,0.06,1.36,-0.10,1.14,-0.18);
    bs.lineTo(1.00,-0.22);bs.bezierCurveTo(0.82,-0.04,0.74,0.22,0.68,0.46);
    bs.bezierCurveTo(0.62,0.68,0.62,0.84,0.72,0.86);
    const bm=new THREE.Mesh(new THREE.ShapeGeometry(bs,32),mats.web);
    bm.position.z=W;webGroup.add(bm);
  }
}
window.updateWeb=updateWeb;

// Resize canvas
function onResize(){
  const w=gcanvas.parentElement.clientWidth,h=gcanvas.parentElement.clientHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);onResize();

// Render loop
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();

// ── UI FUNCTIONS ─────────────────────────────────────────────────────────
function setView(v){
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  const vp={back:[0,0.5,-6.5,0,0.4,0.21],palm:[0,0.5,6.8,0,0.4,0.21],side:[4.5,0.5,0.21,0,0.4,0.21]}[v]||[0,0.5,-6.5,0,0.4,0.21];
  camera.position.set(vp[0],vp[1],vp[2]);controls.target.set(vp[3],vp[4],vp[5]);controls.update();
}
window.setView=setView;

function pickColor(zid,ck){
  const color=COLORS.find(c=>c.k===ck);
  ST.colors[zid]=color;
  if(mats[zid])mats[zid].color.set(color.h);
  document.querySelectorAll(`.sw-wrap[data-z="${zid}"]`).forEach(s=>s.classList.toggle('on',s.dataset.k===ck));
  const cp=document.getElementById('cp-'+zid);if(cp)cp.style.background=color.h;
  const cn=document.getElementById('cn-'+zid);if(cn)cn.textContent=color.n;
  if(zid==='back'){
    if(mats.laces)mats.laces.color.set(color.h);
    ST.colors.laces=color;
    document.querySelectorAll(`.sw-wrap[data-z="laces"]`).forEach(s=>s.classList.toggle('on',s.dataset.k===ck));
    const cp2=document.getElementById('cp-laces');if(cp2)cp2.style.background=color.h;
    const cn2=document.getElementById('cn-laces');if(cn2)cn2.textContent=color.n;
  }
  updateSummary();
}
window.pickColor=pickColor;

document.querySelectorAll('input[name="hand"]').forEach(r=>r.addEventListener('change',()=>{
  ST.hand=r.value;glove.scale.x=r.value==='left'?-1:1;updateSummary();
}));
document.querySelectorAll('input[name="size"]').forEach(r=>r.addEventListener('change',()=>{ST.size=r.value;updateSummary();}));
document.querySelectorAll('input[name="web"]').forEach(r=>r.addEventListener('change',()=>{ST.web=r.value;updateWeb();updateSummary();}));
document.querySelectorAll('input[name="stiff"]').forEach(r=>r.addEventListener('change',()=>{ST.stiff=r.value;updateSummary();}));

function setLang(l){
  lang=l;
  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',
    (l==='zh'&&b.textContent.includes('中'))||(l==='en'&&b.textContent==='EN')||(l==='ja'&&b.textContent.includes('日'))));
  const t=T[l];
  document.getElementById('bsub').childNodes[0].textContent=t.step1?t.back:'手套客製化';
  document.querySelectorAll('[data-k]').forEach(el=>{const v=t[el.dataset.k];if(v)el.textContent=v;});
  document.querySelectorAll('[data-wk]').forEach(el=>{const v=t.ws[el.dataset.wk];if(v)el.textContent=v;});
  buildZones();updateSummary();
}
window.setLang=setLang;

function go(n){
  document.querySelectorAll('.sc').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.stab').forEach((t,i)=>{
    t.classList.remove('on','done');
    if(i+1<n)t.classList.add('done');
    if(i+1===n)t.classList.add('on');
  });
  const el=document.getElementById('s'+n);if(el)el.classList.add('on');
  updateSummary();
}
window.go=go;

function buildZones(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const c=document.getElementById('czones');c.innerHTML='';
  ZONES.forEach(z=>{
    const sel=ST.colors[z.id];
    const d=document.createElement('div');d.className='czone';
    d.innerHTML=`<div class="czone-hdr"><div class="cprev" id="cp-${z.id}" style="background:${sel.h}"></div><span class="czone-name">${zl[z.id]}</span><span class="cname-cur" id="cn-${z.id}">${sel.n}</span></div><div class="swatches">${COLORS.map(c=>`<div class="sw-wrap${c.k===sel.k?' on':''}" data-z="${z.id}" data-k="${c.k}" onclick="pickColor('${z.id}','${c.k}')"><div class="sw" style="background:${c.h}" title="${c.n}"></div><span class="sw-lbl">${c.n}</span></div>`).join('')}</div>`;
    c.appendChild(d);
  });
}

function updateSummary(){
  const t=T[lang];
  const zl={back:t.back,palm:t.palm,web:t.web,laces:t.laces,binding:t.binding,stitching:t.stitching};
  const rows=[
    {k:t.throwHand,v:t.hl[ST.hand]},{k:t.size,v:ST.size},{k:t.webStyle,v:t.ws[ST.web]},{k:t.stiffness,v:t.sl[ST.stiff]},
    ...ZONES.map(z=>({k:zl[z.id],v:ST.colors[z.id]?.n,c:ST.colors[z.id]?.h}))
  ];
  document.getElementById('srows').innerHTML=rows.map(r=>`<div class="srow"><span class="skey">${r.k}</span><span class="sval">${r.c?`<span class="sdot" style="background:${r.c}"></span>`:''} ${r.v||'—'}</span></div>`).join('');
}

async function doSubmit(){
  const t=T[lang];
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const errEl=document.getElementById('emailErr');
  if(!name){alert(t.nameErr);return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent=t.submitting;
  const payload={hand:ST.hand,size:ST.size,web:ST.web,stiffness:ST.stiff,
    colors:Object.fromEntries(Object.entries(ST.colors).map(([k,v])=>[k,v.n])),
    thumbText:document.getElementById('thumbTxt').value,pinkyText:document.getElementById('pinkyTxt').value,
    palmText:document.getElementById('palmTxt').value,wristText:document.getElementById('wristTxt').value,
    specialNotes:document.getElementById('notesTxt').value,customerName:name,customerEmail:email,
    customerPhone:document.getElementById('cPhone').value};
  try{
    const res=await fetch('https://anan53.onrender.com/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error();
    document.querySelectorAll('.sc').forEach(el=>el.style.display='none');
    const sc=document.getElementById('succScreen');sc.style.display='block';
    sc.querySelector('[data-k="succTitle"]').textContent=t.succTitle;
    sc.querySelector('[data-k="succMsg"]').textContent=t.succMsg;
  }catch(e){btn.disabled=false;btn.textContent=t.submit;alert('送出失敗，請稍後再試。');}
}
window.doSubmit=doSubmit;

buildZones();updateSummary();updateWeb();
</script>
