<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手套客製化 | 阿男伍叁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EE;--surface:#FFF;--surface2:#F0EBE4;
  --accent:#9B7250;--accent-dk:#7A5438;--accent-lt:#F5EDE3;
  --text:#1C1A18;--muted:#8C8078;--border:#DDD4C8;--ok:#2A9E6A;
  --r:4px;--t:.2s ease;
  --gv-back:#C19A6B;--gv-web:#5C3010;--gv-binding:#D4A017;
  --gv-laces:#C19A6B;--gv-palm:#C19A6B;--gv-stitching:#8B6914;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06);height:68px}
.logo{display:flex;align-items:center;gap:16px}
.logo img{height:50px;width:auto}
.logo-sep{width:1px;height:34px;background:var(--border)}
.logo-sub{font-family:'Fahkwang',sans-serif;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.5px}
.logo-sub small{display:block;font-family:'Montserrat',sans-serif;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.hdr-badge{font-family:'Fahkwang',sans-serif;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

/* LAYOUT */
.main{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 68px)}

/* OPTIONS PANEL */
.opts{border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;height:100%}

/* Accordion */
.acd-item{border-bottom:1px solid var(--border)}
.acd-hdr{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;user-select:none;transition:background var(--t);min-height:54px}
.acd-hdr:hover{background:var(--surface2)}
.acd-hdr.open{background:var(--accent-lt)}
.acd-num{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--muted);flex-shrink:0}
.acd-hdr.open .acd-num{background:var(--accent);color:#fff;border-color:var(--accent)}
.acd-label{font-size:12px;font-weight:700;flex:1;letter-spacing:.3px}
.acd-val{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-right:6px;max-width:110px;text-align:right}
.acd-dot{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.12);flex-shrink:0}
.acd-arrow{font-size:9px;color:var(--muted);transition:transform .2s;flex-shrink:0}
.acd-hdr.open .acd-arrow{transform:rotate(180deg)}
.acd-body{padding:12px 18px 16px;border-top:1px solid var(--border)}

/* Thumbnail grid */
.thumb-grid{display:flex;flex-wrap:wrap;gap:8px}
.thumb-opt{position:relative;cursor:pointer}
.thumb-opt input{position:absolute;opacity:0;width:0;height:0}
.thumb-card{border:2px solid var(--border);border-radius:6px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;transition:var(--t);min-width:82px;cursor:pointer}
.thumb-card:hover{border-color:var(--accent);background:var(--accent-lt)}
.thumb-opt input:checked+.thumb-card{border-color:var(--accent);background:var(--accent-lt)}
.thumb-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.thumb-lbl{font-size:11px;font-weight:600;text-align:center;line-height:1.4}
.thumb-opt input:checked+.thumb-card .thumb-lbl{color:var(--accent)}
.thumb-sub{font-size:9px;font-weight:400;color:var(--muted);display:block}

/* Pill buttons */
.pill-grid{display:flex;flex-wrap:wrap;gap:6px}
.pill-opt{position:relative}
.pill-opt input{position:absolute;opacity:0;width:0;height:0}
.pill-lbl{display:block;padding:8px 16px;border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);transition:var(--t);cursor:pointer;white-space:nowrap}
.pill-opt input:checked+.pill-lbl{border-color:var(--accent);background:var(--accent);color:#fff}
.pill-lbl:hover{border-color:var(--accent);color:var(--accent)}

/* Color swatches */
.swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sw-opt{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.sw-chip{width:100%;aspect-ratio:1;border-radius:4px;border:2px solid transparent;transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:0 1px 3px rgba(0,0,0,.16)}
.sw-opt:hover .sw-chip{transform:scale(1.1);box-shadow:0 3px 8px rgba(0,0,0,.24)}
.sw-opt.on .sw-chip{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,114,80,.28)}
.sw-name{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.2;font-weight:500}
.sw-opt.on .sw-name{color:var(--accent);font-weight:700}

/* Input */
.inp{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-size:12px;font-family:'Montserrat',sans-serif;transition:var(--t)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,114,80,.1)}
.inp::placeholder{color:var(--muted)}
.inp-row{margin-bottom:8px}
.inp-lbl{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;letter-spacing:.3px}
.err{color:#C0392B;font-size:10px;margin-top:3px;display:none;font-weight:600}

/* Submit */
.submit-area{padding:16px 18px 24px;background:var(--surface)}
.submit-title{font-family:'Fahkwang',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.btn-sub{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;transition:var(--t);letter-spacing:.5px;margin-top:8px}
.btn-sub:hover{background:var(--accent-dk)}
.btn-sub:disabled{opacity:.5;cursor:not-allowed}

/* PREVIEW PANEL */
.preview{overflow-y:auto;height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 24px;gap:20px;background:var(--bg)}
.pv-label{font-family:'Fahkwang',sans-serif;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.glove-stage{background:#F8F3EC;border:1px solid var(--border);border-radius:8px;padding:20px;width:100%;max-width:360px;display:flex;justify-content:center}
.glove-stage svg{width:100%;max-width:300px;height:auto}

/* SVG zone fills */
.gz-back{fill:var(--gv-back)}
.gz-web{fill:var(--gv-web)}
.gz-palm{fill:var(--gv-palm)}
.gz-laces{fill:var(--gv-laces)}
/* binding edge strip on each piece */
.gz-bd{stroke:var(--gv-binding);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.gz-stitch{fill:none;stroke:var(--gv-stitching);stroke-width:1.5;stroke-dasharray:5,4;opacity:.72}
.gz-sep{fill:none;stroke:rgba(0,0,0,.16);stroke-width:1}
.gz-line{fill:none;stroke:rgba(0,0,0,.12);stroke-width:1;stroke-linejoin:round}

/* Summary card */
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;width:100%;max-width:360px}
.scard-title{font-family:'Fahkwang',sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:10px}
.srow:last-child{border-bottom:none}
.skey{color:var(--muted);font-weight:500}
.sval{font-weight:700;display:flex;align-items:center;gap:4px}
.sdot{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}

/* Success */
.succ{display:none;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:60px 20px}
.succ.on{display:flex}
.succ-icon{width:68px;height:68px;background:var(--ok);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.succ h2{font-family:'Fahkwang',sans-serif;font-size:20px}
.succ p{color:var(--muted);line-height:1.7;font-size:13px;max-width:300px}

@media(max-width:780px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  .opts{height:auto;overflow-y:visible}
  .preview{height:auto}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <img src="/logo.png" alt="阿男伍叁" onerror="this.style.display='none'">
    <div class="logo-sep"></div>
    <div class="logo-sub">A-Nan 53<small>Custom Baseball Glove</small></div>
  </div>
  <span class="hdr-badge">Glove Builder</span>
</header>

<div class="main" id="mainGrid">

  <!-- ══ LEFT: OPTIONS ══ -->
  <div class="opts">

    <!-- 01 慣用手 -->
    <div class="acd-item">
      <div class="acd-hdr open" onclick="toggle(this)">
        <div class="acd-num">01</div>
        <span class="acd-label">慣用手</span>
        <span class="acd-val" id="val-hand">右投</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body">
        <div class="thumb-grid">
          <label class="thumb-opt">
            <input type="radio" name="hand" value="right" checked onchange="setHand('right')">
            <div class="thumb-card">
              <div class="thumb-icon">
                <svg viewBox="0 0 46 58" fill="none">
                  <ellipse cx="23" cy="40" rx="17" ry="13" fill="#C9A87A" opacity=".8"/>
                  <rect x="14" y="6" width="8" height="34" rx="4" fill="#C9A87A"/>
                  <rect x="7" y="9" width="7" height="31" rx="3.5" fill="#C9A87A"/>
                  <rect x="22" y="5" width="7" height="34" rx="3.5" fill="#C9A87A"/>
                  <rect x="29" y="9" width="7" height="30" rx="3.5" fill="#C9A87A"/>
                </svg>
              </div>
              <span class="thumb-lbl">右投<span class="thumb-sub">佩戴左手</span></span>
            </div>
          </label>
          <label class="thumb-opt">
            <input type="radio" name="hand" value="left" onchange="setHand('left')">
            <div class="thumb-card">
              <div class="thumb-icon">
                <svg viewBox="0 0 46 58" fill="none" style="transform:scaleX(-1)">
                  <ellipse cx="23" cy="40" rx="17" ry="13" fill="#C9A87A" opacity=".8"/>
                  <rect x="14" y="6" width="8" height="34" rx="4" fill="#C9A87A"/>
                  <rect x="7" y="9" width="7" height="31" rx="3.5" fill="#C9A87A"/>
                  <rect x="22" y="5" width="7" height="34" rx="3.5" fill="#C9A87A"/>
                  <rect x="29" y="9" width="7" height="30" rx="3.5" fill="#C9A87A"/>
                </svg>
              </div>
              <span class="thumb-lbl">左投<span class="thumb-sub">佩戴右手</span></span>
            </div>
          </label>
        </div>
      </div>
    </div>

    <!-- 02 尺寸 -->
    <div class="acd-item">
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">02</div>
        <span class="acd-label">尺寸</span>
        <span class="acd-val" id="val-size">11.5"</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <div class="pill-grid">
          <label class="pill-opt"><input type="radio" name="size" value='11.5"' checked onchange="ST.size=this.value;setVal('size',this.value);updSum()"><span class="pill-lbl">11.5"</span></label>
          <label class="pill-opt"><input type="radio" name="size" value='12.0"' onchange="ST.size=this.value;setVal('size',this.value);updSum()"><span class="pill-lbl">12.0"</span></label>
          <label class="pill-opt"><input type="radio" name="size" value='12.5"' onchange="ST.size=this.value;setVal('size',this.value);updSum()"><span class="pill-lbl">12.5"</span></label>
          <label class="pill-opt"><input type="radio" name="size" value='13.0"' onchange="ST.size=this.value;setVal('size',this.value);updSum()"><span class="pill-lbl">13.0"</span></label>
        </div>
      </div>
    </div>

    <!-- 03 虎口款式 -->
    <div class="acd-item">
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">03</div>
        <span class="acd-label">虎口款式</span>
        <span class="acd-val" id="val-web">I 型</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <div class="thumb-grid">
          <label class="thumb-opt"><input type="radio" name="web" value="i-web" checked onchange="setWeb(this.value,'I 型')"><div class="thumb-card"><div class="thumb-icon"><svg viewBox="0 0 44 52"><rect x="19" y="4" width="7" height="44" rx="3" fill="#5C3010"/><rect x="9" y="22" width="27" height="7" rx="3" fill="#5C3010"/></svg></div><span class="thumb-lbl">I 型</span></div></label>
          <label class="thumb-opt"><input type="radio" name="web" value="h-web" onchange="setWeb(this.value,'H 型')"><div class="thumb-card"><div class="thumb-icon"><svg viewBox="0 0 44 52"><rect x="7" y="4" width="7" height="44" rx="3" fill="#5C3010"/><rect x="30" y="4" width="7" height="44" rx="3" fill="#5C3010"/><rect x="7" y="22" width="30" height="7" rx="3" fill="#5C3010"/></svg></div><span class="thumb-lbl">H 型</span></div></label>
          <label class="thumb-opt"><input type="radio" name="web" value="basket" onchange="setWeb(this.value,'網兜型')"><div class="thumb-card"><div class="thumb-icon"><svg viewBox="0 0 44 52"><ellipse cx="22" cy="26" rx="15" ry="20" fill="#5C3010" opacity=".18"/><ellipse cx="22" cy="26" rx="15" ry="20" fill="none" stroke="#5C3010" stroke-width="5"/></svg></div><span class="thumb-lbl">網兜型</span></div></label>
          <label class="thumb-opt"><input type="radio" name="web" value="single-post" onchange="setWeb(this.value,'單柱型')"><div class="thumb-card"><div class="thumb-icon"><svg viewBox="0 0 44 52"><rect x="19" y="4" width="7" height="44" rx="3" fill="#5C3010"/></svg></div><span class="thumb-lbl">單柱型</span></div></label>
        </div>
      </div>
    </div>

    <!-- 04 硬度 -->
    <div class="acd-item">
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">04</div>
        <span class="acd-label">硬度</span>
        <span class="acd-val" id="val-stiff">中等</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <div class="pill-grid">
          <label class="pill-opt"><input type="radio" name="stiff" value="soft" onchange="ST.stiff=this.value;setVal('stiff','軟');updSum()"><span class="pill-lbl">軟（立即上場）</span></label>
          <label class="pill-opt"><input type="radio" name="stiff" value="medium" checked onchange="ST.stiff=this.value;setVal('stiff','中等');updSum()"><span class="pill-lbl">中等（推薦）</span></label>
          <label class="pill-opt"><input type="radio" name="stiff" value="hard" onchange="ST.stiff=this.value;setVal('stiff','硬');updSum()"><span class="pill-lbl">硬（自行養）</span></label>
        </div>
      </div>
    </div>

    <!-- 05–10 Color zones (built by JS) -->
    <div id="colorItems"></div>

    <!-- 11 刺繡 -->
    <div class="acd-item">
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">11</div>
        <span class="acd-label">刺繡文字</span>
        <span class="acd-val" id="val-emb">（未填）</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <div class="inp-row"><div class="inp-lbl">拇指管（最多 8 字）</div><input class="inp" id="thumbTxt" maxlength="8" placeholder="例：A-Nan 53" oninput="updEmb()"></div>
        <div class="inp-row"><div class="inp-lbl">小指管（最多 8 字）</div><input class="inp" id="pinkyTxt" maxlength="8" placeholder="例：你的名字" oninput="updEmb()"></div>
        <div class="inp-row"><div class="inp-lbl">掌心（最多 10 字）</div><input class="inp" id="palmTxt" maxlength="10" placeholder="可留空" oninput="updEmb()"></div>
        <div class="inp-row" style="margin-bottom:0"><div class="inp-lbl">腕帶（最多 12 字）</div><input class="inp" id="wristTxt" maxlength="12" placeholder="可留空" oninput="updEmb()"></div>
      </div>
    </div>

    <!-- 12 特殊需求 -->
    <div class="acd-item">
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">12</div>
        <span class="acd-label">特殊需求</span>
        <span class="acd-val" id="val-note">（未填）</span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <textarea class="inp" id="notesTxt" rows="3" placeholder="任何特殊客製需求…" oninput="setVal('note',this.value?'已填':'（未填）')"></textarea>
      </div>
    </div>

    <!-- Contact + Submit -->
    <div class="submit-area">
      <div class="submit-title">聯絡資訊</div>
      <div class="inp-row"><input class="inp" id="cName" placeholder="姓名 *"></div>
      <div class="inp-row">
        <input class="inp" id="cEmail" type="email" placeholder="Email *">
        <div class="err" id="emailErr">請輸入正確的 Email</div>
      </div>
      <div class="inp-row" style="margin-bottom:0"><input class="inp" id="cPhone" placeholder="電話（選填）"></div>
      <button class="btn-sub" id="submitBtn" onclick="doSubmit()">送出訂單</button>
    </div>

  </div><!-- /opts -->

  <!-- ══ RIGHT: PREVIEW ══ -->
  <div class="preview">
    <div class="pv-label">即時預覽</div>

    <div class="glove-stage">
      <!--
        Baseball glove — back/shell view (右投左戴)
        ViewBox 300×420, fingers point up, thumb to lower-right.
        Zones: gz-back (shell), gz-web (web pocket), gz-laces, gz-stitch
        Binding edge: gz-bd adds thin stroke in --gv-binding color to any element.
      -->
      <svg id="gloveSvg" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="gf-sh" x="-22%" y="-10%" width="150%" height="135%">
            <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#00000030"/>
          </filter>
        </defs>

        <!-- Ground shadow -->
        <ellipse cx="138" cy="414" rx="88" ry="6" fill="#00000018"/>

        <!-- ══ PALM BODY ══ -->
        <path class="gz-back gz-bd" filter="url(#gf-sh)"
          d="M 42,192
             Q 32,198 24,224
             Q 16,254 16,290
             Q 16,328 26,358
             Q 38,384 62,398
             Q 92,412 130,414
             Q 168,412 196,398
             Q 220,384 232,358
             Q 242,326 240,288
             Q 238,250 226,222
             Q 217,200 212,192 Z"/>

        <!-- ══ FINGER STALLS (overlap into palm ~20px) ══ -->
        <!-- Pinky  — width 26, tips at y=60, base extends to y=212 -->
        <rect class="gz-back gz-bd" x="45" y="60" width="26" height="152" rx="13"/>
        <!-- Ring   — width 30 -->
        <rect class="gz-back gz-bd" x="79" y="40" width="30" height="172" rx="15"/>
        <!-- Middle — width 32, tallest -->
        <rect class="gz-back gz-bd" x="117" y="20" width="32" height="192" rx="16"/>
        <!-- Index  — width 30 -->
        <rect class="gz-back gz-bd" x="157" y="40" width="30" height="172" rx="15"/>

        <!-- ══ THUMB (rotated ~24° from vertical toward lower-right) ══ -->
        <rect class="gz-back gz-bd" x="214" y="190" width="24" height="116" rx="12"
              transform="rotate(24,226,192)"/>

        <!-- ══ WEB POCKET (thumb–index junction) ══ -->
        <path class="gz-web gz-bd" id="svgWeb"
          d="M 187,198
             Q 202,190 220,200
             Q 236,214 233,246
             Q 230,268 217,276
             Q 203,282 192,268
             Q 180,252 182,224
             Q 183,208 187,198 Z"/>

        <!-- ══ LACE DOTS ══ -->
        <!-- Pinky-Ring gap -->
        <circle class="gz-laces" cx="75" cy="108" r="5"/>
        <circle class="gz-laces" cx="75" cy="136" r="5"/>
        <!-- Ring-Middle gap -->
        <circle class="gz-laces" cx="113" cy="88" r="5"/>
        <circle class="gz-laces" cx="113" cy="116" r="5"/>
        <!-- Middle-Index gap -->
        <circle class="gz-laces" cx="153" cy="92" r="5"/>
        <circle class="gz-laces" cx="153" cy="120" r="5"/>
        <!-- Web laces -->
        <circle class="gz-laces" cx="208" cy="222" r="4.5"/>
        <circle class="gz-laces" cx="215" cy="248" r="4.5"/>

        <!-- ══ BACK STITCHING ══ -->
        <path class="gz-stitch" d="M 54,254 Q 128,258 202,248"/>
        <path class="gz-stitch" d="M 50,284 Q 128,288 206,278"/>
        <path class="gz-stitch" d="M 48,314 Q 128,318 208,308"/>

        <!-- ══ FINGER-GAP LINES (show lace channel between stalls) ══ -->
        <line class="gz-sep" x1="71" y1="196" x2="71" y2="216"/>
        <line class="gz-sep" x1="79" y1="196" x2="79" y2="216"/>
        <line class="gz-sep" x1="109" y1="196" x2="109" y2="216"/>
        <line class="gz-sep" x1="117" y1="196" x2="117" y2="216"/>
        <line class="gz-sep" x1="149" y1="196" x2="149" y2="216"/>
        <line class="gz-sep" x1="157" y1="196" x2="157" y2="216"/>

      </svg>
    </div>

    <!-- Summary -->
    <div class="scard">
      <div class="scard-title">規格摘要</div>
      <div id="srows"></div>
    </div>

    <!-- Success (hidden) -->
    <div class="succ" id="succScreen">
      <div class="succ-icon">✓</div>
      <h2>訂單已送出！</h2>
      <p>感謝您的客製訂單，我們將在 2 個工作天內以 Email 與您聯繫確認細節與報價。</p>
    </div>
  </div><!-- /preview -->

</div><!-- /main -->

<script>
const ST={hand:'right',size:'11.5"',web:'i-web',stiff:'medium',
  colors:{
    back:{k:'tan',h:'#C19A6B',n:'原色棕'},
    web:{k:'choco',h:'#5C3010',n:'巧克力'},
    binding:{k:'gold',h:'#D4A017',n:'金'},
    laces:{k:'tan',h:'#C19A6B',n:'原色棕'},
    palm:{k:'tan',h:'#C19A6B',n:'原色棕'},
    stitching:{k:'dark-tan',h:'#8B6914',n:'深棕'}
  }
};

const COLORS=[
  {k:'tan',h:'#C19A6B',n:'原色棕'},{k:'camel',h:'#D4A870',n:'駱駝'},
  {k:'dark-tan',h:'#8B6040',n:'深棕'},{k:'choco',h:'#5C3010',n:'巧克力'},
  {k:'black',h:'#1A1A1A',n:'黑'},{k:'white',h:'#F2EDE3',n:'白'},
  {k:'red',h:'#CC2200',n:'紅'},{k:'scarlet',h:'#FF4422',n:'朱紅'},
  {k:'orange',h:'#E87020',n:'橙'},{k:'gold',h:'#D4A017',n:'金'},
  {k:'yellow',h:'#E8C020',n:'黃'},{k:'navy',h:'#0E2040',n:'深藍'},
  {k:'royal',h:'#1848A0',n:'皇藍'},{k:'sky',h:'#4090CC',n:'天藍'},
  {k:'green',h:'#1A6830',n:'深綠'},{k:'lime',h:'#48A840',n:'草綠'},
  {k:'purple',h:'#5820A0',n:'紫'},{k:'pink',h:'#E04080',n:'粉紅'},
  {k:'gray',h:'#808080',n:'灰'},{k:'silver',h:'#C8C8C8',n:'銀'},
];

const ZONES=[
  {id:'back',    num:'05',label:'背面革色'},
  {id:'web',     num:'06',label:'虎口革色'},
  {id:'binding', num:'07',label:'邊條顏色'},
  {id:'laces',   num:'08',label:'綁繩顏色'},
  {id:'palm',    num:'09',label:'掌心革色'},
  {id:'stitching',num:'10',label:'車縫顏色'},
];
const CSS_VAR={back:'--gv-back',web:'--gv-web',binding:'--gv-binding',laces:'--gv-laces',palm:'--gv-palm',stitching:'--gv-stitching'};

function applyVar(z,h){document.documentElement.style.setProperty(CSS_VAR[z],h);}

/* Accordion */
function toggle(hdr){
  const wasOpen=hdr.classList.contains('open');
  document.querySelectorAll('.acd-hdr.open').forEach(h=>{
    h.classList.remove('open');
    const b=h.nextElementSibling;if(b&&b.classList.contains('acd-body'))b.style.display='none';
  });
  if(!wasOpen){
    hdr.classList.add('open');
    const b=hdr.nextElementSibling;if(b&&b.classList.contains('acd-body'))b.style.display='block';
  }
}
window.toggle=toggle;

/* Build color zone items */
function buildColorItems(){
  const cont=document.getElementById('colorItems');cont.innerHTML='';
  ZONES.forEach(z=>{
    const cur=ST.colors[z.id];
    const d=document.createElement('div');d.className='acd-item';
    d.innerHTML=`
      <div class="acd-hdr" onclick="toggle(this)">
        <div class="acd-num">${z.num}</div>
        <span class="acd-label">${z.label}</span>
        <span class="acd-val"><span class="acd-dot" id="dot-${z.id}" style="background:${cur.h}"></span><span id="cn-${z.id}">${cur.n}</span></span>
        <span class="acd-arrow">▼</span>
      </div>
      <div class="acd-body" style="display:none">
        <div class="swatch-grid">
          ${COLORS.map(c=>`<div class="sw-opt${c.k===cur.k?' on':''}" data-z="${z.id}" data-k="${c.k}" onclick="pickColor('${z.id}','${c.k}')"><div class="sw-chip" style="background:${c.h}" title="${c.n}"></div><span class="sw-name">${c.n}</span></div>`).join('')}
        </div>
      </div>`;
    cont.appendChild(d);
  });
}

function pickColor(zid,ck){
  const color=COLORS.find(c=>c.k===ck);
  ST.colors[zid]=color;
  applyVar(zid,color.h);
  const dot=document.getElementById('dot-'+zid);if(dot)dot.style.background=color.h;
  const cn=document.getElementById('cn-'+zid);if(cn)cn.textContent=color.n;
  document.querySelectorAll(`.sw-opt[data-z="${zid}"]`).forEach(s=>s.classList.toggle('on',s.dataset.k===ck));
  updSum();
}
window.pickColor=pickColor;

/* Hand */
function setHand(v){
  ST.hand=v;
  document.getElementById('gloveSvg').style.transform=v==='left'?'scaleX(-1)':'none';
  setVal('hand',v==='right'?'右投':'左投');
  updSum();
}
window.setHand=setHand;

/* Web style paths — all share same outer shape, zone fill changes */
const WEB_BASE='M 187,198 Q 202,190 220,200 Q 236,214 233,246 Q 230,268 217,276 Q 203,282 192,268 Q 180,252 182,224 Q 183,208 187,198 Z';
const WEB_PATHS={
  'i-web':      WEB_BASE,
  'h-web':      WEB_BASE,
  'basket':     WEB_BASE,
  'single-post':WEB_BASE,
};
function setWeb(v,label){
  ST.web=v;
  const p=document.getElementById('svgWeb');
  if(p)p.setAttribute('d',WEB_PATHS[v]||WEB_PATHS['i-web']);
  setVal('web',label);updSum();
}
window.setWeb=setWeb;

function setVal(id,v){const el=document.getElementById('val-'+id);if(el)el.textContent=v;}
window.setVal=setVal;

function updEmb(){
  const t=[document.getElementById('thumbTxt'),document.getElementById('pinkyTxt'),
           document.getElementById('palmTxt'),document.getElementById('wristTxt')].some(el=>el.value.trim());
  setVal('emb',t?'已填':'（未填）');
}
window.updEmb=updEmb;

/* Summary */
const STIFF={soft:'軟',medium:'中等',hard:'硬'};
function updSum(){
  const rows=[
    {k:'慣用手',v:ST.hand==='right'?'右投（佩戴左手）':'左投（佩戴右手）'},
    {k:'尺寸',v:ST.size},
    {k:'虎口款式',v:document.getElementById('val-web')?.textContent||'I 型'},
    {k:'硬度',v:STIFF[ST.stiff]},
    ...ZONES.map(z=>({k:z.label,v:ST.colors[z.id]?.n,c:ST.colors[z.id]?.h})),
  ];
  document.getElementById('srows').innerHTML=rows.map(r=>`
    <div class="srow">
      <span class="skey">${r.k}</span>
      <span class="sval">${r.c?`<span class="sdot" style="background:${r.c}"></span>`:''} ${r.v||'—'}</span>
    </div>`).join('');
}

/* Submit */
async function doSubmit(){
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const errEl=document.getElementById('emailErr');
  if(!name){alert('請填寫姓名');return;}
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='送出中…';
  const payload={
    hand:ST.hand,size:ST.size,web:ST.web,stiffness:ST.stiff,
    colors:Object.fromEntries(Object.entries(ST.colors).map(([k,v])=>[k,v.n])),
    thumbText:document.getElementById('thumbTxt').value,
    pinkyText:document.getElementById('pinkyTxt').value,
    palmText:document.getElementById('palmTxt').value,
    wristText:document.getElementById('wristTxt').value,
    specialNotes:document.getElementById('notesTxt').value,
    customerName:name,customerEmail:email,
    customerPhone:document.getElementById('cPhone').value,
  };
  try{
    const res=await fetch('https://anan53.onrender.com/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error();
    document.getElementById('mainGrid').style.display='none';
    const sc=document.getElementById('succScreen');sc.classList.add('on');sc.scrollIntoView();
  }catch(e){
    btn.disabled=false;btn.textContent='送出訂單';
    alert('送出失敗，請稍後再試。');
  }
}
window.doSubmit=doSubmit;

/* Init */
buildColorItems();
Object.entries(ST.colors).forEach(([k,v])=>applyVar(k,v.h));
updSum();
</script>
</body>
</html>
